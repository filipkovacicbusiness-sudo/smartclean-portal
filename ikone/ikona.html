<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:PF;src:url(../fonts/playfair-display-latin-700-normal.woff2) format('woff2');font-weight:700;}html,body{margin:0;background:transparent;}svg{display:block;}</style></head><body><div id="o"></div>
<script>
// Ikona SmartClean 2: monogram »SC« (Playfair Display 700, -0,03em) na sivi matirani podlagi z zrnom
// in zbledelimi barvami cenikov (zelena logotipa, modra, vijolična, oranžna, rožnata).
const T = {
  dark:  { bg: ['#2a2e2d', '#161918', '#0c0e0d'], a: 1.0, s: ['#ffffff', '#e6ece9'], c: ['#9be9c3', '#62c995'], sh: 'rgba(0,0,0,.5)', zrno: .55 },
  grey:  { bg: ['#9aa09e', '#7d8481', '#5f6563'], a: .9,  s: ['#ffffff', '#eef2f0'], c: ['#d6fbe8', '#a8efcb'], sh: 'rgba(0,0,0,.28)', zrno: .6 },
  light: { bg: ['#f3f5f4', '#e4e8e6', '#d3d8d6'], a: .75, s: ['#16302a', '#0a1913'], c: ['#24845a', '#145a3b'], sh: 'rgba(13,31,23,.10)', zrno: .45 }
};
const BARVE = [['#1f8f5f', 'g'], ['#2f6fe0', 'b'], ['#7a5ae0', 'v'], ['#e08a1e', 'o'], ['#d9486f', 'r']];
// razpored madežev (x, y, polmer, prosojnost) — ročno izbran, »naključno« zbledel, zelena prevladuje
const MADEZI = [[.18, .14, .62, .62, 0], [.92, .10, .46, .34, 1], [.86, .92, .58, .40, 2], [.10, .96, .44, .30, 3], [.55, .55, .30, .10, 4]];
function squircle(n) { const a = n / 2, e = 5, p = []; for (let i = 0; i <= 360; i++) { const t = i * Math.PI / 180, c = Math.cos(t), s = Math.sin(t); p.push([a + a * Math.sign(c) * Math.pow(Math.abs(c), 2 / e), a + a * Math.sign(s) * Math.pow(Math.abs(s), 2 / e)]); } return 'M' + p.map(q => q[0].toFixed(2) + ',' + q[1].toFixed(2)).join('L') + 'Z'; }
window.risi = async function (o) {
  await document.fonts.load('700 100px PF');
  const N = 1024, t = T[o.tema], id = 'g' + Math.random().toString(36).slice(2, 7);
  const oblika = o.oblika === 'squircle' ? `<path d="${squircle(N)}"/>` : o.oblika === 'circle' ? `<circle cx="${N/2}" cy="${N/2}" r="${N/2}"/>` : `<rect width="${N}" height="${N}"/>`;
  const madezi = MADEZI.map((m, i) => `<radialGradient id="${id}m${i}" cx="${m[0]}" cy="${m[1]}" r="${m[2]}"><stop offset="0" stop-color="${BARVE[m[4]][0]}" stop-opacity="${(m[3] * t.a).toFixed(2)}"/><stop offset="1" stop-color="${BARVE[m[4]][0]}" stop-opacity="0"/></radialGradient>`).join('');
  const ozadje = o.oblika === 'none' ? '' : `<g clip-path="url(#${id}k)">
      <rect width="${N}" height="${N}" fill="url(#${id}b)"/>
      ${MADEZI.map((m, i) => `<rect width="${N}" height="${N}" fill="url(#${id}m${i})"/>`).join('')}
      <rect width="${N}" height="${N}" filter="url(#${id}n)" opacity="${t.zrno}" style="mix-blend-mode:soft-light"/>
      <rect width="${N}" height="${N}" fill="url(#${id}v)"/></g>`;
  document.getElementById('o').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${N}" height="${N}" viewBox="0 0 ${N} ${N}"><defs>
      <clipPath id="${id}k">${oblika}</clipPath>
      <linearGradient id="${id}b" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="${t.bg[0]}"/><stop offset=".55" stop-color="${t.bg[1]}"/><stop offset="1" stop-color="${t.bg[2]}"/></linearGradient>
      ${madezi}
      <radialGradient id="${id}v" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="${o.tema === 'light' ? .05 : .28}"/></radialGradient>
      <filter id="${id}n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="${o.zrnoF || .9}" numOctaves="3" stitchTiles="stitch" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
      <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.s[0]}"/><stop offset="1" stop-color="${t.s[1]}"/></linearGradient>
      <linearGradient id="${id}c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.c[0]}"/><stop offset="1" stop-color="${t.c[1]}"/></linearGradient>
      <filter id="${id}f" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="${N * .008}" stdDeviation="${N * .014}" flood-color="${t.sh}"/></filter>
    </defs>${ozadje}
    <text id="${id}t" font-family="PF" font-weight="700" font-size="400" x="0" y="0" filter="${o.oblika === 'none' ? '' : `url(#${id}f)`}"><tspan fill="url(#${id}s)">S</tspan><tspan fill="url(#${id}c)">C</tspan></text></svg>`;
  const tx = document.getElementById(id + 't');
  const m = document.createElement('canvas').getContext('2d'); m.font = '700 400px PF'; m.letterSpacing = '-12px';
  const mm = m.measureText('SC'), w = mm.actualBoundingBoxLeft + mm.actualBoundingBoxRight, h = mm.actualBoundingBoxAscent + mm.actualBoundingBoxDescent;
  const k = (o.sirina * N) / w, fs = 400 * k;
  tx.setAttribute('font-size', fs.toFixed(2)); tx.setAttribute('letter-spacing', (-0.03 * fs).toFixed(2));
  tx.setAttribute('x', (N / 2 - (w * k) / 2 + mm.actualBoundingBoxLeft * k).toFixed(2));
  tx.setAttribute('y', (N / 2 + (h * k) / 2 - mm.actualBoundingBoxDescent * k).toFixed(2));
  return { w: w * k / N };
};
</script></body></html>
