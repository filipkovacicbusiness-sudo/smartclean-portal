     izklopiti). Brez te oznake je vrstica z uro polna, v barvi teme (theme-color), stran pa se začne pod njo —

<script>
/* Tema PRED prvim izrisom (kot boot.js v portalu) + zagonski zaslon. */
(function(){
  try{
    var p = localStorage.getItem("pralnica:tema") || "dark", h = new Date().getHours();
    var t = p === "auto" ? ((h >= 7 && h < 19) ? "light" : "dark") : (p === "light" ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", t === "light" ? "#ffffff" : "#0a0a0a");
  }catch(e){}
  try{ document.documentElement.classList.add("sc-booting"); }catch(e){}
  try{ if(window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)) document.documentElement.classList.add("sc-sam"); }catch(e){}
  window.scBootDone = function(){
    try{ document.documentElement.classList.remove("sc-booting"); }catch(e){}
    var b = document.getElementById("scBoot"); if(!b || b.__d) return; b.__d = 1;
    b.classList.add("scBoot-hide");
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 560);
  };
  /* splash ostane, dokler se ne pokaže prijava ali aplikacija (prej je po 8 s izginil in pri
     počasni povezavi ostal prazen zaslon); po 5 s pove, kaj se dogaja; varovalo 32 s je v app.js */
  setTimeout(function(){ var b = document.getElementById("scBoot"); if(!b || b.__d) return;
    var t = document.createElement("div"); t.className = "scBoot-t"; t.textContent = "Povezujem s portalom …";
    var i = b.querySelector(".scBoot-in"); if(i){ i.appendChild(t); requestAnimationFrame(function(){ t.classList.add("vidno"); }); } }, 5000);
  (function cakaj(n){ setTimeout(function(){
    var p = document.getElementById("prijava"), a = document.getElementById("app");
    if(n < 24 && p && a && p.hidden && a.hidden){ cakaj(n + 1); return; }
    try{ window.scBootDone(); }catch(e){}
  }, n ? 1000 : 8000); })(0);
})();
</script>

<script>
  if("serviceWorker" in navigator && location.protocol === "https:" && !/^localhost$/.test(location.hostname)){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
    /* Nova koda prevzame nadzor → osveži, a le ob posodobitvi (ne ob prvi namestitvi — takrat
       je stran že sveža; prej je osvežitev prekinila ravno odprto prijavo) in v varnem trenutku
       (ne sredi vnosa lista, v odprtem oknu ali med tipkanjem). */
    var _swImel = !!navigator.serviceWorker.controller, _swReload = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(!_swImel){ _swImel = true; return; }
      if(_swReload) return; _swReload = true;
      /* Osveži le, če ta stran res teče s staro kodo. Stran se naloži z mreže, zato ima
         nova različica navadno že najnovejšo kodo — prej se je vseeno osvežila in za
         trenutek znova pokazala zagonski zaslon, ko si bil že notri. */
      fetch(location.href.split("#")[0], { cache: "no-store" }).then(function(r){ return r.text(); }).then(function(t){
        var m = /VARIANTA = "[^"]*", APP_VERZIJA = "([^"]+)"/.exec(t);
        if(!m || m[1] === window.__scVerzija) return;
        (function poskusi(){ if(!window.__scVarno || window.__scVarno()) location.reload(); else setTimeout(poskusi, 3000); })();
      }).catch(function(){});
    });
  }
</script>
