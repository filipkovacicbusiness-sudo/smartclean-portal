<script>
/* Tema in pogled PRED prvim izrisom (kot boot.js v portalu) + zagonski zaslon. */
(function(){
  try{
    var p = localStorage.getItem("pralnica:tema") || "dark", h = new Date().getHours();
    var t = p === "auto" ? ((h >= 7 && h < 19) ? "light" : "dark") : (p === "light" ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", t === "light" ? "#ffffff" : "#0a0a0a");
  }catch(e){}
  try{ document.documentElement.dataset.view = localStorage.getItem("sc-view") === "grid" ? "grid" : "list"; }catch(e){ document.documentElement.dataset.view = "list"; }
  try{ document.documentElement.classList.add("sc-booting"); }catch(e){}
  window.scBootDone = function(){
    try{ document.documentElement.classList.remove("sc-booting"); }catch(e){}
    var b = document.getElementById("scBoot"); if(!b || b.__d) return; b.__d = 1;
    b.classList.add("scBoot-hide");
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 560);
  };
  setTimeout(function(){ try{ window.scBootDone(); }catch(e){} }, 8000);
})();
</script>
<!-- zagonski zaslon in ozadje prijave: prevzeto iz index.html portala -->

<!-- ══════════ PRIJAVA (kot v portalu) ══════════ -->
<div class="auth hidden" id="auth">
  <header class="auth-top">
    <div class="topbar-in">
      <div class="wordmark">Smart<span>Clean</span></div>
      <button class="icon-btn" type="button" data-tema aria-label="Preklop teme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <div class="auth-main">
    <div class="auth-hero">
      <h2 class="auth-claim">Peremo, vi pa <em>blestite.</em></h2>
    </div>
    <div class="auth-slot">
      <div class="profile-picker hidden" id="profilePicker">
        <h1>Izberi profil</h1>
        <div class="pp-grid" id="ppGrid"></div>
        <div class="msg" id="ppMsg" role="status" aria-live="polite"></div>
      </div>
      <div class="auth-box hidden" id="authBox">
        <p class="eyebrow">Prijava</p>
        <h1>Dobrodošli nazaj</h1>
        <p class="sub">Vpišite se s podatki za portal SmartClean.</p>
        <form id="acctForm" novalidate>
          <div class="field">
            <label for="acctEmail">E-poštni naslov</label>
            <input type="email" id="acctEmail" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" required/>
          </div>
          <div class="field">
            <label for="acctPass">Geslo</label>
            <input type="password" id="acctPass" autocomplete="current-password" required/>
          </div>
          <button type="submit" class="btn" id="acctBtn">Prijavi se</button>
        </form>
        <p class="under"><button type="button" class="link-btn hidden" id="acctBack">‹ Nazaj na profile</button></p>
        <div class="msg" id="acctErr" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>
  <a class="auth-foot" href="https://eflitte.si" target="_blank" rel="noopener">Izdelava <b>eflitte</b></a>
</div>

<!-- ══════════ APLIKACIJA ══════════ -->
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-in">
      <div class="wordmark">Smart<span>Clean</span></div>
      <div class="tools">
        <span class="who"><span class="who-name" id="tbIme"></span><span class="who-role">spremni listi</span></span>
        <div class="notif-wrap">
          <button class="icon-btn" id="syncBtn" type="button" aria-label="Prenos v portal" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/></svg>
            <span class="notif-dot" id="syncDot"></span>
          </button>
        </div>
        <button class="icon-btn" type="button" data-tema aria-label="Preklop teme">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn hidden" id="izklopBtn" type="button" aria-label="Izklop aplikacije">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v8.5"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>
        </button>
        <button class="link-btn" id="zamenjajBtn" type="button">Zamenjaj</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="sec" id="sec-listi">
      <div class="head">
        <div><h2>Spremni listi</h2><p class="count" id="listiPod"></p></div>
        <div class="filtri">
          <input type="search" id="isci" placeholder="Iskanje po številki …" inputmode="numeric" aria-label="Iskanje po številki"/>
          <button type="button" id="novBtn" class="btn btn-narrow">+ Nov spremni list</button>
          <select id="filterStranka" aria-label="Stranka"></select>
          <span class="arh-obd">
            <label class="arh-lab">Datum<input type="date" id="filterDatum" class="arh-dan" aria-label="Datum"/></label>
            <button type="button" id="filterDatumX" class="arh-obd-x hidden" aria-label="Počisti datum" title="Počisti datum">×</button>
          </span>
          <div class="seg pogled-seg" role="group" aria-label="Pogled">
            <button type="button" class="seg-b" data-view="list">Seznam</button>
            <button type="button" class="seg-b" data-view="grid">Mreža</button>
          </div>
        </div>
      </div>
      <div id="listiStanje"></div>
      <div id="listi"></div>
      <div class="ap-vec" id="listiVec"></div>
      <p class="u-sub ap-noga" id="noga"></p>
    </section>
  </main>
</div>

<div class="sc-toast" id="toast" role="status" aria-live="polite"></div>

<script src="supabase.js"></script>
<script>{{JS}}</script>
<script>
  if("serviceWorker" in navigator && location.protocol === "https:" && !/^localhost$/.test(location.hostname)){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
    /* Ko nova koda prevzame nadzor, se enkrat samodejno osveži. */
    var _swReload = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){ if(_swReload) return; _swReload = true; location.reload(); });
  }
</script>
</body>
</html>
