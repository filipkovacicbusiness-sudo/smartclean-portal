<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Archivo;src:url(archivo.woff2) format("woff2");font-weight:100 900;}
:root{color-scheme:light dark;--bg:#ffffff;--ink:#0a0a0a;--line:#d9d9d9;}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--ink:#f2f2f2;--line:#333333;}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,sans-serif;-webkit-tap-highlight-color:transparent;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;box-sizing:border-box;}
h1{margin:0;font-size:24px;font-weight:500;letter-spacing:-.02em;}
button{height:52px;padding:0 30px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:16px;font-weight:600;}
button:active{transform:scale(.98);}
</style>
</head>
<body>
<h1>Ni povezave</h1>
<button type="button" onclick="location.replace(document.body.dataset.portal)">Poskusi znova</button>
</body>
</html>
