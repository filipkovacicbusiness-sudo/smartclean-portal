.pris-new:focus{border-color:var(--green-l);outline:none;}
.pris-add .pris-add-btn{flex:0 0 auto;white-space:nowrap;padding:8px 22px;border-radius:9px;}
@media(max-width:600px){ .pris-add{flex-direction:column;} .pris-add .pris-add-btn{width:100%;} }
.pris-lab{display:block;font-size:.78rem;color:var(--mid);margin:4px 0 6px;}
.pris-cas{width:100%;}
.pris-r-cas{display:flex;gap:10px;}
.pris-r-cas>div{flex:1;min-width:0;}
.pris-r-cas input{width:100%;}
/* Ročni vnos — več intervalov (izmen) na dan; vmesni čas = pavza. */
.pris-intervali{display:flex;flex-direction:column;gap:8px;margin-top:2px;}
.pris-int-row{display:flex;align-items:center;gap:8px;}
.pris-int-row .sc-modal-input{margin:0;flex:1 1 0;min-width:0;}
.pris-int-sep{flex:0 0 auto;color:var(--mid);font-weight:600;}
.pris-int-del{flex:0 0 auto;width:36px;height:44px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--mid);cursor:pointer;font-size:1.15rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;}
.pris-int-del:hover{border-color:var(--st-bad);color:var(--st-bad);}
.pris-int-add{margin-top:10px;border:1.5px dashed var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:9px 14px;cursor:pointer;font-family:var(--sans);font-size:.85rem;font-weight:600;}
.pris-int-add:hover{border-color:var(--green-l);background:var(--green-m);}
@media(max-width:600px){
  .pris-emp{flex-direction:column;align-items:stretch;gap:9px;}
  .pris-emp .pris-nm{white-space:normal;overflow:visible;text-overflow:clip;}
  .pris-emp-act{display:grid;grid-template-columns:1fr 1fr;gap:6px;justify-content:stretch;}
  .pris-emp-act .cgrp-btn{width:100%;text-align:center;padding:9px 8px;}
  /* Prisotnost tabele: časi prihodov/odhodov ostanejo vidni; vodoravni scroll, imena v eni vrstici */
  #sec-prisotnost .pris-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;}
  #sec-prisotnost .pris-tbl-dan,#sec-prisotnost .pris-tbl-oseba{min-width:600px;}
  #sec-prisotnost .pris-tbl th{font-size:.64rem;padding:6px 6px;white-space:nowrap;}
  #sec-prisotnost .pris-tbl td{padding:8px 6px;font-size:.82rem;}
  #sec-prisotnost .pris-tbl td:first-child,#sec-prisotnost .pris-tbl th:first-child{white-space:nowrap;max-width:34vw;overflow:hidden;text-overflow:ellipsis;}
  /* Več intervalov na dan se zloži v stolpcu drug pod drugega. Z nowrap so pri stalni
     širini stolpca (table-layout:fixed) prekrili »Ur« in »+ ročno«. Posamezen interval
     se ne prelomi (.pris-chip ima svoj nowrap). */
  #sec-prisotnost .pris-pairs{white-space:normal;}
}

/* Mobilno: skrij vrstico z davčno št. in naslovom v okvirčku stranke */
@media(max-width:760px){
  #content .arts > .meta{display:none;}
}

/* Mobilno: Fakture — »Od« in »Do« skupaj v isti vrstici, stranka in gumb pod njima */
@media(max-width:760px){
  #sec-fakture .filtri{flex-direction:row;flex-wrap:wrap;align-items:stretch;gap:8px;}
  #sec-fakture .filtri .fak-obd{flex:1 1 100%;width:100%;gap:8px;}
  #sec-fakture .filtri .fak-obd .fak-lab{flex:1 1 0;min-width:0;justify-content:flex-start;}
  #sec-fakture .filtri .fak-obd .fak-lab input{flex:1 1 auto;min-width:0;width:auto;max-width:100%;}
  #sec-fakture .filtri .cs,
  #sec-fakture .filtri select,
  #sec-fakture .filtri #fakBtn{flex:1 1 100%;max-width:none;width:100%;}
}

/* ══════════ DOKUMENTI (skenirani računi) ══════════ */
/* Admin — vloge in pravice */
.adm-top{margin:0 0 14px;}
.adm-tabs{flex-wrap:wrap;max-width:100%;}
.adm-role{margin-bottom:14px;}
.adm-chk input:disabled+span{opacity:.5;}
.adm-list{display:flex;flex-direction:column;}
.adm-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line);}
.adm-item:last-child{border-bottom:none;}
.adm-item .adm-sec{font-size:.95rem;font-weight:600;color:var(--ink);}
.adm-only{font-size:.66rem;font-weight:500;color:var(--mid);background:var(--green-m);padding:2px 8px;border-radius:100px;margin-left:8px;vertical-align:middle;}
.adm-perms{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
.adm-pill{display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:6px 13px;border:1px solid var(--line);border-radius:100px;color:var(--mid);cursor:pointer;user-select:none;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;}
.adm-pill input{position:absolute;opacity:0;width:0;height:0;}
.adm-pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.adm-pill.dis{opacity:.55;cursor:default;}
.adm-pill input:focus-visible+*,.adm-pill:focus-within{box-shadow:0 0 0 3px var(--green-m);border-radius:100px;}
@media(max-width:560px){.adm-item{flex-wrap:wrap;gap:8px;}.adm-perms{justify-content:flex-start;}}
/* Admin — dnevnik sprememb */
.log-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.log-row{display:flex;align-items:flex-start;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);}
.log-row:last-child{border-bottom:none;}
.log-row:nth-child(even){background:var(--green-m);}
.log-raz{flex:0 0 auto;font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--mid);background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:4px 10px;margin-top:1px;min-width:74px;text-align:center;}
.log-mid{flex:1;min-width:0;}
.log-op{font-size:.9rem;color:var(--ink);line-height:1.4;word-break:break-word;}
.log-meta{font-size:.76rem;color:var(--mid);margin-top:3px;}
.adm-role-h{display:flex;align-items:center;gap:12px;margin:0 0 12px;}
.adm-ime{font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;max-width:280px;flex:1;}
.adm-ime:focus{border-color:var(--green-l);outline:none;}
.adm-role-key{font-family:var(--mono);font-size:.72rem;color:var(--mid);text-transform:uppercase;letter-spacing:.04em;background:var(--green-m);padding:4px 9px;border-radius:100px;}
.adm-tbl-wrap{overflow-x:auto;}
.adm-tbl{width:100%;border-collapse:collapse;min-width:420px;}
.adm-tbl th,.adm-tbl td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);}
.adm-tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:var(--mid);font-weight:600;}
.adm-tbl th:first-child,.adm-tbl td.adm-sec{text-align:left;font-weight:600;color:var(--ink);font-size:.9rem;white-space:nowrap;}
.adm-chk{display:inline-flex;cursor:pointer;}
.adm-chk input{position:absolute;opacity:0;width:0;height:0;}
.adm-chk span{width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;}
.adm-chk input:checked+span{background:var(--ink);border-color:var(--ink);}
.adm-chk input:checked+span::after{content:'';width:5px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px;}
.adm-chk input:focus-visible+span{border-color:var(--green-l);box-shadow:0 0 0 3px var(--green-m);}
.adm-save{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:6px;}
.adm-save .msg{margin:0;flex:1;}
.adm-save .btn{margin-top:0;width:auto;}
@media(max-width:560px){.adm-ime{font-size:1rem;}}
/* Dokumenti — orodna gumba (nova mapa / naloži) */
.dok-tbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;width:auto;padding:0 18px;height:44px;}
.dok-tbtn svg{width:17px;height:17px;flex:0 0 auto;}
/* Dokumenti — datotečni sistem (Finder/Raziskovalec) */
.dok-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 12px;}
.dok-pot{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:.9rem;min-width:0;flex:1 1 auto;}
@media(max-width:560px){.head .filtri .dok-tbtn{width:100%;}}
.dok-crumb{border:none;background:none;color:var(--mid);cursor:pointer;font-size:.9rem;font-weight:600;padding:4px 6px;border-radius:7px;}
.dok-crumb:last-child{color:var(--ink);}
.dok-crumb:hover{background:var(--green-m);color:var(--ink);}
.dok-sep{color:var(--mid);opacity:.6;}
.dok-drop-hint{font-size:.85rem;color:var(--green-t);font-weight:600;}
.dok-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:6px;}
.dok-item{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 12px 12px;
  display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;text-align:center;
  transition:border-color .14s,background .14s,transform .06s,box-shadow .14s;}
.dok-item:hover{border-color:var(--ink);box-shadow:var(--shadow);}
.dok-item:active{transform:scale(.98);}
.dok-ic{width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:10px;background-size:cover;background-position:center;}
.dok-ic svg{width:44px;height:44px;}
.dok-ic-folder{color:#e6b64c;}
.dok-ic-folder.zakl{color:#e0a53a;}
.dok-ic-pdf{color:#e15759;}
.dok-ic-word{color:#4e79a7;}
.dok-ic-excel{color:#59a14f;}
.dok-ic-file{color:var(--mid);}
.dok-ic-img{width:64px;height:56px;border:1px solid var(--line);}
.dok-nm{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}
.dok-sub{font-size:11px;color:var(--mid);}
.dok-x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border:1px solid var(--line);background:var(--surface);color:var(--mid);border-radius:50%;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .14s,color .14s,border-color .14s;box-shadow:var(--shadow);}
.dok-x:hover{color:#c0392b;border-color:#c0392b;}
.dok-item:hover .dok-x,.dok-x:focus-visible{opacity:1;}
/* ⋯ meni gumb na kartici */
.dok-more{position:absolute;top:6px;right:6px;width:26px;height:26px;border:1px solid var(--line);background:var(--surface);color:var(--mid);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .14s,color .14s,border-color .14s;box-shadow:var(--shadow);}
.dok-more svg{width:16px;height:16px;}
.dok-more:hover{color:var(--ink);border-color:var(--ink);}
.dok-item:hover .dok-more,.dok-more:focus-visible{opacity:1;}
.dok-item.dok-cut{opacity:.5;}
/* zaklep na mapi */
.dok-ic{position:relative;}
.dok-lock{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:#e0a53a;display:flex;align-items:center;justify-content:center;}
.dok-lock svg{width:12px;height:12px;}
/* nazaj/naprej + prilepi */
.dok-nav{display:inline-flex;gap:6px;flex:0 0 auto;}
.dok-navbtn{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,opacity .15s;}
.dok-navbtn svg{width:18px;height:18px;}
.dok-navbtn:hover:not(:disabled){border-color:var(--ink);}
.dok-navbtn:disabled{opacity:.35;cursor:default;}
.dok-paste{width:auto;height:34px;margin-top:0;padding:0 16px;flex:0 0 auto;display:inline-flex;align-items:center;font-size:.82rem;}
.dok-paste[hidden]{display:none!important;}
/* akcijski meni */
.dok-menu{position:absolute;z-index:1200;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg,0 18px 44px rgba(0,0,0,.4));padding:6px;display:flex;flex-direction:column;gap:2px;}
.dok-menu-i{text-align:left;border:none;background:none;color:var(--ink);font:inherit;font-size:.88rem;padding:9px 12px;border-radius:8px;cursor:pointer;transition:background .12s;}
.dok-menu-i:hover{background:var(--green-m);}
.dok-menu-i.danger{color:#d9695c;}
.dok-menu-i.danger:hover{background:rgba(217,105,92,.1);}
@media(max-width:560px){.dok-grid{grid-template-columns:repeat(3,1fr);gap:10px;}.dok-x,.dok-more{opacity:1;}}
/* Dokumenti — spoštuj pogled SEZNAM (ikona levo, ime, velikost, meni desno) */
html[data-view="list"] .dok-grid{grid-template-columns:1fr;gap:8px;}
html[data-view="list"] .dok-item{flex-direction:row;align-items:center;text-align:left;gap:14px;padding:10px 46px 10px 14px;min-height:62px;}
html[data-view="list"] .dok-item .dok-ic{width:36px;height:36px;border-radius:8px;}
html[data-view="list"] .dok-item .dok-ic svg{width:26px;height:26px;}
html[data-view="list"] .dok-item .dok-ic-img{width:46px;height:36px;}
html[data-view="list"] .dok-item .dok-nm{flex:1 1 auto;min-width:0;text-align:left;-webkit-line-clamp:1;}
html[data-view="list"] .dok-item .dok-sub{flex:0 0 auto;}
html[data-view="list"] .dok-item .dok-more{opacity:1;top:50%;right:10px;transform:translateY(-50%);}
@media(max-width:560px){html[data-view="list"] .dok-grid{grid-template-columns:1fr;}}
/* Skener */
.sken-modal{max-width:520px;width:100%;}
.sken-strani{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;min-height:96px;padding:12px;border:1px dashed var(--line);border-radius:12px;align-items:flex-start;align-content:flex-start;}
.sken-prazno{color:var(--mid);font-size:.86rem;margin:auto;}
.sken-th{position:relative;width:74px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg);}
.sken-th img{width:100%;height:100%;object-fit:cover;display:block;}
.sken-th-x{position:absolute;top:4px;right:4px;width:22px;height:22px;border:none;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;font-size:15px;line-height:22px;text-align:center;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.sken-th-n{position:absolute;left:4px;bottom:4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.sken-add-row{display:flex;gap:8px;margin:0 0 14px;}
.sken-add{flex:1;width:auto;margin:0;padding:11px 10px;justify-content:center;}
@media(max-width:420px){.sken-add-row{flex-direction:column;}.sken-add{width:100%;}}
.sken-polja{display:flex;flex-direction:column;gap:12px;margin-bottom:6px;}
.sken-f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--mid);}
.sken-f input,.sken-f select{padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px;}
.sken-f input:focus,.sken-f select:focus{border-color:var(--green-l);outline:none;}
/* Pregled slike (lightbox) */
.dok-lb{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));opacity:0;transition:opacity .18s;cursor:zoom-out;}
.dok-lb.show{opacity:1;}
.dok-lb img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.dok-lb-cap{color:rgba(255,255,255,.82);font-size:.85rem;margin-top:14px;text-align:center;max-width:90%;}
.dok-lb-x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;width:42px;height:42px;border:none;background:rgba(255,255,255,.16);color:#fff;border-radius:50%;font-size:23px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.dok-lb-x:hover{background:rgba(255,255,255,.28);}

/* ── Prisotnost: pogled po zaposleni (mesec) ── */
.pris-oseba-sel{margin:4px 0 12px}
.pris-oseba-sel select{width:100%;max-width:340px;height:44px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);padding:0 12px;font-size:15px}
.pris-tbl-oseba td.pris-dan-c{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mid);font-weight:600;width:76px}
.pris-tbl-oseba tr.pris-vikend td{background:var(--green-m)}
.pris-tbl-oseba tr.pris-vikend td.pris-dan-c{color:var(--ink)}

/* ── Artikli: potrditev cene (kljukica + barvna stanja) ── */
.art-row.cena-nic .art-r-cena{color:#c0392b;font-weight:700;}   /* rdeča: 0,00 € */
.art-row.cena-ni  .art-r-cena{color:#d98218;font-weight:700;}   /* oranžna: ni potrjeno */
.art-row.cena-ok  .art-r-cena{color:#1a6644;font-weight:600;}   /* zelena: potrjeno */
.art-row.cena-nic{box-shadow:inset 3px 0 0 #c0392b;}
.art-row.cena-ni{box-shadow:inset 3px 0 0 #d98218;}
.art-row.cena-ok{box-shadow:inset 3px 0 0 #1a6644;}
.art-chk{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:4px;}
.art-chk input{position:absolute;opacity:0;width:1px;height:1px;}
.art-chk-box{width:20px;height:20px;border:1.6px solid var(--line);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;}
.art-row.cena-ni .art-chk-box{border-color:#d98218;}
.art-chk input:checked + .art-chk-box{background:#1a6644;border-color:#1a6644;}
.art-chk input:checked + .art-chk-box::after{content:"\2713";color:#fff;font-size:13px;font-weight:800;line-height:1;}
.art-chk.dis{cursor:not-allowed;opacity:.35;}

/* ── Prisotnost: potrjevanje ur (kljukica na paru prihod–odhod) ── */
.pris-pair{display:inline-flex;align-items:center;gap:5px;}
/* Potrditvena oznaka — čist, monokromatski okrogli gumb (ne surov zeleni checkbox) */
.pris-pair-chk{appearance:none;-webkit-appearance:none;width:16px;height:16px;flex:0 0 auto;margin:0 0 0 4px;cursor:pointer;border:1.5px solid var(--line);border-radius:50%;background:var(--surface);position:relative;transition:border-color .15s,background .15s;}
.pris-pair-chk:hover{border-color:var(--mid);}
.pris-pair-chk:checked{background:var(--ink);border-color:var(--ink);}
.pris-pair-chk:checked::after{content:"";position:absolute;left:5px;top:2px;width:3.5px;height:7px;border:solid var(--surface);border-width:0 1.6px 1.6px 0;transform:rotate(45deg);}
.pris-pair.pot-ni .pris-chip-t{color:var(--mid);}               /* nepotrjeno: prigušeno (prazen krogec levo) */
.pris-pair.pot-ok .pris-chip-t{color:var(--ink);}               /* potrjeno: polna oznaka + ink besedilo */

/* ── Prisotnost: stabilna postavitev (stolpci se ne premikajo med dnevi) ── */
.pris-tbl-dan,.pris-tbl-oseba{table-layout:fixed;}
.pris-tbl-dan tbody td,.pris-tbl-oseba tbody td{height:46px;}   /* stalna višina vrstic — se ne krčijo med dnevi */
.pris-tbl-dan th:nth-child(1),.pris-tbl-dan td:nth-child(1){width:26%;}
.pris-tbl-dan th:nth-child(2),.pris-tbl-dan td:nth-child(2){width:auto;}
.pris-tbl-dan th:nth-child(3),.pris-tbl-dan td:nth-child(3){width:104px;}
.pris-tbl-dan th:nth-child(4),.pris-tbl-dan td:nth-child(4){width:96px;}
.pris-tbl-oseba th:nth-child(1),.pris-tbl-oseba td:nth-child(1){width:92px;}
.pris-tbl-oseba th:nth-child(2),.pris-tbl-oseba td:nth-child(2){width:auto;}
.pris-tbl-oseba th:nth-child(3),.pris-tbl-oseba td:nth-child(3){width:88px;}
.pris-tbl-oseba th:nth-child(4),.pris-tbl-oseba td:nth-child(4){width:92px;}
.pris-tbl-dan .pris-pairs,.pris-tbl-oseba .pris-pairs{white-space:normal;overflow-wrap:anywhere;}

/* ── Prisotnost: poravnani gumbi v seznamu zaposlenih ── */
.pris-emp-act .cgrp-btn{justify-content:center;}
.pris-emp-act [data-uredi]{min-width:64px;}
.pris-emp-act [data-karta]{min-width:118px;}
.pris-emp-act [data-aktiv]{min-width:104px;}
.pris-emp-act [data-izbrisi]{min-width:70px;}
@media(max-width:640px){.pris-emp-act .cgrp-btn,.pris-emp-act [data-karta],.pris-emp-act [data-aktiv]{min-width:0;}}

/* ══════════ IZBIRNIK PROFILOV (prijava) ══════════ */
.profile-picker{width:100%;max-width:370px;}
.profile-picker.hidden{display:none;}
.pp-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px;align-items:stretch;}
.pp-tile-wrap{position:relative;width:110px;display:flex;}
.pp-tile{width:110px;min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 10px 15px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .06s;text-align:center;}
.pp-tile-wrap .pp-tile{width:100%;}
.pp-tile:hover{border-color:var(--ink);box-shadow:var(--shadow);}
.pp-tile:active{transform:scale(.98);}
.pp-av{width:56px;height:56px;border-radius:50%;background:var(--ink) center/cover no-repeat;color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;overflow:hidden;flex:0 0 auto;}
.pp-av img{width:100%;height:100%;object-fit:cover;display:block;}
/* Placeholder ikona »SC« — pisava in barve logotipa (piksel-natančno kot logo) */
.av-sc{background:var(--surface)!important;border:1px solid var(--line);}
.av-sc .sc-s,.av-sc .sc-c{font-family:var(--wm);font-weight:700;letter-spacing:-.03em;line-height:1;}
.av-sc .sc-s{color:var(--wm-ink);}
.av-sc .sc-c{color:var(--wm-green);}
.pp-nm{font-size:13px;font-weight:600;color:var(--ink);line-height:1.25;word-break:break-word;min-height:2.4em;display:flex;align-items:center;justify-content:center;}
.pp-tile-x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border:1px solid var(--line);background:var(--surface);color:var(--mid);border-radius:50%;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .14s,color .14s,border-color .14s;box-shadow:var(--shadow);}
.pp-tile-x:hover{color:var(--ink);border-color:var(--ink);}
.pp-tile-wrap:hover .pp-tile-x,.pp-tile-x:focus-visible{opacity:1;}
/* zaslon na dotik (telefon, tablica) nima lebdenja: × za odstranitev profila mora biti viden */
@media(hover:none){.pp-tile-x{opacity:1;width:28px;height:28px;top:-9px;right:-9px;}}
.pp-add{width:110px;}
.pp-add .pp-av{background:transparent;border:1.5px dashed var(--line);color:var(--mid);font-size:24px;font-weight:400;}
.pp-add .pp-nm{color:var(--mid);}
@media(max-width:520px){.pp-tile-wrap,.pp-add{width:calc(50% - 6px);}}

/* ══════════ UREJANJE PROFILA (Moj račun) ══════════ */
.prof-edit{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;}
.prof-av-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;flex:0 0 auto;}
.prof-av{width:96px;height:96px;border-radius:50%;background:var(--ink) center/cover no-repeat;color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;overflow:hidden;}
.prof-av img{width:100%;height:100%;object-fit:cover;display:block;}
.prof-fields{flex:1;min-width:240px;}
.prof-av-wrap .btn-mini{font-size:.8rem;padding:7px 14px;border:1px solid var(--line);border-radius:100px;
  background:none;color:var(--mid);cursor:pointer;transition:border-color .18s,color .18s,background .18s;white-space:nowrap;}
.prof-av-wrap .btn-mini:hover{border-color:var(--mid);color:var(--ink);}
.prof-av-del{color:var(--coral);border-color:rgba(192,57,43,.3)!important;}
.prof-av-del:hover{border-color:var(--coral)!important;color:var(--coral)!important;background:rgba(192,57,43,.06)!important;}
@media(max-width:560px){.prof-edit{gap:16px;}.prof-av{width:80px;height:80px;}}
/* Poziv za biometrijo ob prvi prijavi */
.bio-promo{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:20px;}
.bio-promo.hidden{display:none;}
.bio-promo-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 28px;box-shadow:var(--shadow);text-align:center;}
.bio-promo-ic{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.bio-promo-ic svg{width:32px;height:32px;}
.bio-promo-card h3{margin:0 0 8px;font-size:1.3rem;}
.bio-promo-card p{color:var(--mid);font-size:.95rem;line-height:1.55;margin:0 0 22px;}
.bio-promo-btns{display:flex;gap:10px;}
.bio-promo-btns .btn{margin-top:0;flex:1;}
.btn.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.btn-ghost:hover{background:var(--green-m);}
/* Obvestila (toast) vsem uporabnikom */
.obv-wrap{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:250;width:calc(100% - 32px);max-width:460px;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
.obv-card{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;animation:obvIn .22s ease;}
@keyframes obvIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
.obv-ic{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--green-m);color:var(--ink);display:flex;align-items:center;justify-content:center;}
.obv-ic svg{width:17px;height:17px;}
.obv-body{flex:1;min-width:0;}
.obv-nas{font-weight:700;font-size:.92rem;margin:0 0 2px;color:var(--ink);}
.obv-txt{font-size:.88rem;color:var(--mid);line-height:1.45;white-space:pre-wrap;word-break:break-word;}
.obv-x{flex:0 0 auto;border:none;background:none;color:var(--mid);font-size:18px;line-height:1;cursor:pointer;padding:0 2px;}
.obv-x:hover{color:var(--ink);}
/* Konzola (lastnik) */
.konz-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.konz-row{border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start;}
.konz-row.off{opacity:.55;}
.konz-row .k-body{flex:1;min-width:0;}
.konz-nas{font-weight:700;font-size:.92rem;margin:0 0 2px;}
.konz-txt{font-size:.88rem;color:var(--mid);line-height:1.45;white-space:pre-wrap;word-break:break-word;}
.konz-meta{font-size:.74rem;color:var(--mid);margin-top:6px;}
.konz-acts{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}
.konz-acts .btn-mini{font-size:.78rem;padding:6px 13px;border:1px solid var(--line);border-radius:100px;background:none;color:var(--mid);cursor:pointer;transition:border-color .18s,color .18s,background .18s;white-space:nowrap;}
.konz-acts .btn-mini:hover{border-color:var(--mid);color:var(--ink);}
.konz-acts .btn-mini.danger{color:var(--coral);border-color:rgba(192,57,43,.3);}
.konz-acts .btn-mini.danger:hover{border-color:var(--coral);background:rgba(192,57,43,.06);}
/* Opomba na spremnem listu (Arhiv) */
.opomba-blok{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
/* Naslov bloka opombe v slogu naslovov portala (stavčni, Archivo), ne kot razprt napis z velikimi črkami. */
.opomba-h{font-family:var(--sans);font-size:.95rem;font-weight:600;letter-spacing:-.005em;color:var(--ink);margin-bottom:8px;}
.opomba-prikaz{background:var(--green-m);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:10px;}
.opomba-besedilo{font-size:.9rem;line-height:1.5;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
.opomba-avtor{margin-top:6px;font-size:.76rem;color:var(--mid);}
.opomba-vnos{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:.9rem;line-height:1.5;resize:vertical;min-height:56px;box-sizing:border-box;}
.opomba-vnos:focus{border-color:var(--green-l);background:var(--surface);outline:none;}
.opomba-acts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;}
.opomba-save{padding:9px 20px;border:none;border-radius:100px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.85rem;cursor:pointer;transition:opacity .18s;}
.opomba-save:hover{opacity:.85;}
.opomba-remove{padding:6px 2px;border:none;background:none;color:var(--coral);font-size:.82rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.opomba-remove:hover{opacity:.78;}
.bio-lead{color:var(--mid);font-size:.9rem;margin:0 0 16px;max-width:52ch;}
.bio-row{display:flex;gap:10px;flex-wrap:wrap;}
.bio-off{background:transparent;color:#c0392b;border:1px solid rgba(192,57,43,.35);}
.bio-off:hover{background:rgba(192,57,43,.08);border-color:#c0392b;}
.pp-bio{position:absolute;left:60%;top:53px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--surface);pointer-events:none;}
.pp-bio svg{width:13px;height:13px;}
/* Prijavni izbirnik — nežen vstop + jasnejši status med Touch ID/Face ID */
.pp-grid{animation:scfadein .34s ease both;}
.pp-tile{transition:border-color .16s,box-shadow .16s,transform .12s cubic-bezier(.34,1.2,.5,1);}
.pp-tile:hover{transform:translateY(-2px);}
.bio-pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--wm-green,#3fae6b);margin-right:9px;vertical-align:middle;animation:dotpulse 1.35s infinite;}

/* ── stabilnost števk po prehodu na eflitte pisavo (tabularne cifre) ── */
.cenik-meta,.cgrp-count,.art-cena,.art-pick-item b,.art-id,.art-r-id,.art-r-teza,
.pris-count,.pris-pairs,.pk-id,.uc3d-pct,.adm-role-key,.clk-time{font-variant-numeric:tabular-nums;}

/* ── Arhiv: obdobje od–do ─────────────────────────────────────────── */
/* Oznaka »Od«/»Do« je SAM okvir — tako polje nikoli ni prazen bel kvadratek
   (na iPhonu prazen type=date ne pokaže ničesar), ampak vedno piše Od / Do. */
.arh-obd{display:inline-flex;align-items:center;gap:8px;}
.arh-lab{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 12px;
  border:1.5px solid var(--line);border-radius:9px;background:var(--bg);
  font-size:.82rem;font-weight:600;color:var(--mid);white-space:nowrap;margin:0;box-sizing:border-box;cursor:pointer;}
.arh-lab:focus-within{border-color:var(--green-l);}
.arh-obd .arh-dan{max-width:none;min-width:0;height:auto;padding:0;border:none;background:transparent;color:var(--ink);
  font-family:var(--sans);font-size:16px;font-weight:400;font-variant-numeric:tabular-nums;box-sizing:border-box;flex:1 1 auto;}
.arh-obd .arh-dan:focus{outline:none;}
.arh-obd .arh-dan::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55;}
.arh-obd .arh-dan::-webkit-datetime-edit,
.arh-obd .arh-dan::-webkit-datetime-edit-text,
.arh-obd .arh-dan::-webkit-datetime-edit-month-field,
.arh-obd .arh-dan::-webkit-datetime-edit-day-field,
.arh-obd .arh-dan::-webkit-datetime-edit-year-field{color:var(--ink);}
:root[data-theme="dark"] .arh-obd .arh-dan::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6;}
.arh-obd-sep{color:var(--mid);flex:0 0 auto;font-weight:500;}
.arh-obd-x{flex:0 0 auto;width:30px;height:30px;border:none;background:var(--green-m);color:var(--ink);border-radius:100px;cursor:pointer;font-size:1.05rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;}
.arh-obd-x.hidden{display:none;}
@media(max-width:720px){
  .filtri .arh-obd{display:flex;width:100%;gap:8px;}
  .filtri .arh-obd .arh-lab{flex:1 1 0;min-width:0;}
  .filtri .arh-obd .arh-lab .arh-dan{flex:1 1 auto;min-width:0;max-width:none;width:auto;}
  .filtri .arh-obd .arh-obd-x{width:44px;height:44px;font-size:1.2rem;}
}

/* ── enotna eflitte tipografija naslovov (vsepovsod) ─────────────────── */
h3.sec,h3.sec-h,.empty h3,.fak-card-h h3,.adm-ime,.stat-num,.auth-claim,
.bio-promo-card h3{letter-spacing:-.028em;}

/* ── Stranke: seznam artiklov z urejanjem teže ─────────────────────── */
.str-arts{display:flex;flex-direction:column;gap:2px;margin:6px 0 8px;}
.str-art{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);}
.str-art:last-child{border-bottom:none;}
.str-art .art-id{flex:0 0 auto;}
.str-art-nm{flex:1 1 auto;min-width:0;font-size:.92rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.str-art-teza{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;}
.str-teza-in{width:66px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px;text-align:right;font-variant-numeric:tabular-nums;font-family:var(--sans);}
.str-teza-in:focus{border-color:var(--green-l);outline:none;}
.str-teza-u{font-size:.8rem;color:var(--mid);}
.str-art .art-cena{flex:0 0 auto;min-width:64px;text-align:right;}
/* skupno št. opranih kosov (vseh časov) */
.str-art-kos{flex:0 0 auto;min-width:74px;text-align:right;font-size:.78rem;color:var(--mid);font-variant-numeric:tabular-nums;}
/* kljukica »viden v aplikaciji« (monokromatski kvadratni checkbox) */
.str-art-app{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:.72rem;color:var(--mid);user-select:none;min-width:48px;}
.str-art-app.off{color:var(--mid);opacity:.7;font-style:italic;}
.str-app-chk{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;flex:0 0 auto;border:1.5px solid var(--line);border-radius:5px;background:var(--surface);position:relative;cursor:pointer;transition:background .15s,border-color .15s;}
.str-app-chk:hover{border-color:var(--mid);}
.str-app-chk:checked{background:var(--ink);border-color:var(--ink);}
.str-app-chk:checked::after{content:"";position:absolute;left:5px;top:2px;width:3.5px;height:7px;border:solid var(--surface);border-width:0 1.6px 1.6px 0;transform:rotate(45deg);}
@media(max-width:560px){.str-art-nm{white-space:normal;}.str-art-kos{min-width:56px;}}

/* samodejno izračunana teža v obrazcu novega lista */
.ur-kg-auto{display:flex;align-items:center;min-height:44px;padding:0 12px;border:1.5px dashed var(--line);border-radius:9px;background:var(--green-m);color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600;}

/* Web view dostop (toggle v Uporabnikih) */
.u-acts .u-web.on{border-color:transparent;background:rgba(52,199,110,.16);color:#1a7d43;}
html[data-theme="dark"] .u-acts .u-web.on{background:rgba(110,211,161,.16);color:var(--wm-green);}
.u-acts .u-pin.on{border-color:transparent;background:rgba(52,199,110,.16);color:#1a7d43;}
html[data-theme="dark"] .u-acts .u-pin.on{background:rgba(110,211,161,.16);color:var(--wm-green);}

/* Arhiv: kdo je izdelal spremni list */
.a-izdal{font-size:.76rem;color:var(--mid);display:inline-flex;align-items:center;gap:4px;}
.a-izdal::before{content:"·";color:var(--line);}

/* Arhiv: oznaka in dnevnik popravkov */
.a-pop{margin-left:7px;font-size:.8rem;color:var(--st-warn);vertical-align:middle;}
.ur-popravki{margin-top:6px;padding:8px 11px;border-radius:8px;background:var(--green-m);color:var(--mid);font-size:.82rem;line-height:1.5;white-space:normal;}

/* ── Arhiv: prekrivanja (offline urejanje) ─────────────────────────── */
.konf-card{border:1.5px solid var(--st-warn);border-radius:12px;background:rgba(194,149,31,.08);margin:0 0 14px;overflow:hidden;}
.konf-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;}
.konf-warn{font-weight:600;color:var(--ink);font-size:.92rem;}
.konf-toggle{flex:0 0 auto;}
.konf-list{padding:0 14px 12px;display:flex;flex-direction:column;gap:12px;}
.konf-row{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px;}
.konf-title{font-weight:600;margin-bottom:10px;font-variant-numeric:tabular-nums;}
.konf-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:620px){.konf-cols{grid-template-columns:1fr;}}
.konf-col{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.konf-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mid);font-weight:600;}
.konf-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;}
.konf-items li{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;}
.konf-items b{font-variant-numeric:tabular-nums;}
.konf-log{font-size:.78rem;color:var(--mid);background:var(--green-m);border-radius:7px;padding:6px 9px;line-height:1.45;}
.konf-toggle,.konf-keep{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:100px;padding:7px 15px;font-size:.82rem;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s;}
.konf-toggle:hover,.konf-keep:hover{border-color:var(--ink);}
.konf-keep{align-self:flex-start;margin-top:auto;}
.konf-keep.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.konf-keep.primary:hover{opacity:.85;}

/* ── Gorivo ─────────────────────────────────────────────────────────────
   Štiri številke na vrhu, pod njimi tankanja. Stolpci s številkami so
   desno poravnani, znaka za račun in urejanje na sredini. */
.gor-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.gor-s{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;min-width:0;}
.gor-s>span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mid);}
.gor-s>b{display:block;margin-top:5px;font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gor-s>small{display:block;margin-top:3px;font-size:.72rem;color:var(--mid);}
@media(max-width:860px){.gor-stat{grid-template-columns:repeat(2,1fr);}}
@media(max-width:420px){.gor-stat{grid-template-columns:1fr;}}

#sec-gorivo .gor-tbl th:not(:first-child):not(:nth-child(7)),
#sec-gorivo .gor-tbl td:not(:first-child):not(:nth-child(7)){text-align:right;}
#sec-gorivo .gor-tbl th.gor-c,#sec-gorivo .gor-tbl td.gor-c{text-align:center;}
.gor-tbl th{white-space:nowrap;}
/* Z DDV in brez: glavna vrednost je z DDV (tak je racun), neto pod njo. */
.gor-tbl th small{display:block;font-size:.62rem;font-weight:500;text-transform:none;letter-spacing:0;color:var(--mid);opacity:.75;}
.gor-neto{display:block;font-size:.72rem;font-weight:500;color:var(--mid);}
.gor-uradna{margin:2px 0 10px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);}
.gor-uradna-op{color:var(--mid);}
.gor-tbl .gor-rac{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--mid);
  padding:4px 8px;display:inline-flex;align-items:center;cursor:pointer;}
.gor-tbl .gor-rac:hover{border-color:var(--mid);color:var(--ink);}
.gor-tbl .gor-ur{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--mid);
  padding:4px 11px;font-size:.78rem;cursor:pointer;}
.gor-tbl .gor-ur:hover{border-color:var(--mid);color:var(--ink);}
/* Tankanje brez priloženega računa je treba opaziti — zaradi tega se ta evidenca vodi. */
.gor-tbl tr.gor-nerac td:first-child{box-shadow:inset 2px 0 0 var(--st-warn);}
.gor-tbl .gor-brez{color:var(--st-warn);}
.gor-leto{height:32px;padding:0 30px 0 12px;border:1px solid var(--line);border-radius:100px;background:var(--surface);
  color:var(--ink);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;}
.gor-modal{max-width:620px;width:min(94vw,620px);text-align:left;}
.gor-modal .ur-form{margin-top:6px;}
.gor-modal input[type=file]{padding:9px 11px;border:1px dashed var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font-size:.85rem;width:100%;}
.gor-rac-stanje{margin:2px 0 0;}
.gor-odstrani{border:none;background:none;padding:0;color:var(--st-bad);text-decoration:underline;
  font:inherit;font-size:inherit;cursor:pointer;}
/* Devet stolpcev se v vsebinski stolpec ob meniju ne izide, zato se tabela
   vodoravno drsi; glava kartice ostane na mestu. */
.gor-scroll{overflow-x:auto;margin:0 -2px;}
.gor-tbl{min-width:730px;}

/* ══════════ OKNO: kartica se razpre v okno (Arhiv, Stranke) — oknoOdpri() v portal.js ══════════
   Nad glavo portala (20), pod potrditvenim oknom in predogledom (60), da ta dva odpreta NAD njim. */
.okno-back{position:fixed;inset:0;z-index:55;display:flex;justify-content:center;align-items:center;
  padding:24px;overscroll-behavior:contain;}
/* Zatemnitev je ločena plast: okno samo mora biti neprosojno že od prvega okvirja animacije.
   pointer-events:none → klik na ozadje zadane .okno-back (zapre okno). */
.okno-zatemni{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .3s ease;pointer-events:none;}
.okno-back.show .okno-zatemni{opacity:1;}
.okno{position:relative;width:min(880px,100%);display:flex;flex-direction:column;overflow:hidden;
  max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 24px 70px rgba(0,0,0,.28);transform-origin:0 0;}   /* senca raste z oknom (del iste plasti) */
/* Kopija kartice med animacijo (oknoDuh): natanko na mestu in v velikosti kartice. */
.okno-duh{position:fixed;pointer-events:none;display:block!important;margin:0;}
.okno-duh > *{width:100%;height:100%!important;margin:0!important;transform:none!important;}
.okno-notr{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;transform-origin:0 0;}   /* nasprotni razteg med rastjo okna */
.okno-glava{position:relative;flex:0 0 auto;}
.okno-telo{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;}
.okno-x{position:absolute;top:16px;right:16px;z-index:2;}
.okno-vir{visibility:hidden;}   /* kartica, iz katere je okno nastalo — njeno mesto ostane prazno */
/* Kartica med nalaganjem vsebine pred odprtjem okna (redko opazno — navadno je že naložena). */
.row.nalaga,.a-row.nalaga{cursor:progress;animation:nalagaPulz .7s ease-in-out infinite alternate;}
@keyframes nalagaPulz{to{opacity:.62;}}
@media(prefers-reduced-motion:reduce){.row.nalaga,.a-row.nalaga{animation:none;opacity:.7;}}
html.okno-zaklep{overflow:hidden;}

/* Glava = kartica, postavljena za okno: brez okvirja in hoverja, statusni levi rob ostane. */
.okno-glava .okno-kartica{margin:0;border-width:0 0 1px 0;border-bottom-color:var(--line);border-radius:0;
  cursor:default;box-shadow:none!important;transform:none!important;padding:20px 64px 18px 22px;pointer-events:none;}
.okno-glava.arh-green .okno-kartica,.okno-glava.arh-yellow .okno-kartica,.okno-glava.arh-red .okno-kartica{border-left-width:4px;}
.okno-glava .okno-kartica .arh-chk.clk{pointer-events:auto;}
.okno-glava .okno-kartica .chev{display:none;}
/* Arhiv: kljukica levo, številka / stranka / podatki drug pod drugim (tudi na telefonu). */
.okno .okno-kartica.a-row{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"chk num" "chk cli" "chk foot";
  column-gap:14px;row-gap:4px;align-items:center;}
.okno .okno-kartica .arh-chk{grid-area:chk;position:static;align-self:start;margin-top:1px;}
.okno .okno-kartica .a-num{grid-area:num;font-size:1.2rem;font-weight:700;}
.okno .okno-kartica .a-cli{grid-area:cli;display:block;white-space:normal;overflow:visible;font-size:.98rem;}
.okno .okno-kartica .a-foot{grid-area:foot;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:flex-start;}
.okno .okno-kartica .a-date{display:inline;}
.okno .okno-kartica .a-qty::before{content:"·";color:var(--line);margin-right:4px;}
.okno .okno-kartica .num{text-align:left;font-size:.84rem;color:var(--mid);}
/* Stranke: naziv večji in brez rezanja, delež in kilaža desno. */
.okno .okno-kartica.row{grid-template-columns:minmax(0,1fr) auto auto;}
.okno .okno-kartica .row-name{display:block;white-space:normal;overflow:visible;font-size:1.15rem;font-weight:700;line-height:1.3;}
.okno .okno-kartica .row-nm{white-space:normal;overflow:visible;max-width:none;}
.okno .okno-kartica .row-legal{display:block;white-space:normal;overflow:visible;margin-top:2px;}
.okno .okno-kartica br{display:none;}   /* naziv je tu blok — <br> bi dodal prazno vrstico */
.okno .okno-kartica .sc-tag{position:static;transform:none;display:inline-block;margin:8px 0 0;}

/* Vsebina v oknu: brez okvirja kartice in brez animacije razpiranja (to zdaj naredi okno). */
.okno .a-det{grid-template-rows:1fr;opacity:1;transition:none;border:0;border-radius:0;margin:0;padding:6px 22px 4px;background:none;}
/* V oknu brez posebnega razkritja vsebine: razkrije jo rast okna. (Zamaknjen pomik vsebine je
   tekel še po tem, ko je okno že stalo, in v nasprotni smeri — animacija je bila videti zatikajoča.) */
.okno .a-det.show .a-det-pad{animation:none;opacity:1;}
.okno .arts{display:block;border:0;border-radius:0;margin:0;padding:14px 22px 20px;background:none;}
/* po razredu, ne po id-ju: oknoOdpri vsebini odstrani id (po ponovnem izrisu bi bil podvojen) */
.okno .nov-list{display:block;border:0;border-radius:0;margin:0;padding:20px 24px 24px;background:none;}
.okno .cgrp-body{display:block;border-top:0;}
.okno .fak-body{display:block;margin:0;padding:18px 22px 22px;border-top:0;}
.okno-glava-sub{font-size:.8rem;color:var(--mid);margin-top:3px;}
/* Cenik & Artikli: skupine v seznamu (mreža: pravila Cenika prek :is(#cenikList,.art-skupine)) */
html[data-view="list"] .art-skupine .cgrp:last-child{margin-bottom:0;}
/* Glava okna brez kartice (nov spremni list): samo naslov + × */
.okno-glava-naslov{padding:20px 64px 16px 22px;border-bottom:1px solid var(--line);}
.okno-glava-naslov .sec-h{margin:0;font-size:1.2rem;line-height:1.3;}
.okno-glava-naslov .okno-x{top:50%;transform:translateY(-50%);}
.btn.nalaga{cursor:progress;animation:nalagaPulz .7s ease-in-out infinite alternate;}

@media(max-width:560px){
  .okno-back{padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));}
  .okno{border-radius:16px;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));}
  .okno-glava .okno-kartica{padding:16px 56px 14px 16px;}
  .okno-x{top:12px;right:12px;}
  .okno .a-det{padding:4px 16px 2px;}
  .okno .arts{padding:12px 16px 16px;}
  .okno .nov-list{padding:14px 16px 18px;}
  .okno .fak-body{padding:14px 16px 18px;}
  .okno-glava-naslov{padding:16px 56px 14px 16px;}
  .okno .okno-kartica.row{grid-template-columns:minmax(0,1fr) auto;}
}
@media(prefers-reduced-motion:reduce){.okno-zatemni{transition:opacity .12s ease;}}

/* ══════════ PRISOTNOST: zaposleni kot okvirčki (Seznam / Mreža) + okno ══════════ */
.pris-zap-card .pris-h{margin-bottom:12px;}
.pris-zap .lcell:last-child .row{margin-bottom:0;}
.pris-neakt .row{opacity:.62;}
.pris-zap .row .pris-badge{display:inline-block;margin-top:4px;align-self:flex-start;}
/* Telefon, pogled Seznam: ure (Prisotnost) in datum prijave (Uporabniki) brez preloma — stolpec po vsebini. */
@media(max-width:560px){
  .pris-zap .row,.u-mreza .row{grid-template-columns:minmax(0,1fr) auto 22px;}
  .pris-zap .row .num,.u-mreza .row .num{white-space:nowrap;}
}
html[data-view="grid"] .pris-zap .row .pris-badge{display:inline-block;align-self:flex-start;margin-top:6px;}
html[data-view="grid"] .pris-zap .row .num::before{content:"danes ";color:var(--mid);}
@media(min-width:561px){
  html[data-view="list"] .pris-zap .lcell .row .pris-badge{position:absolute;right:0;top:50%;transform:translateY(-50%);margin:0;}
}
@media(max-width:560px){
  html[data-view="list"] .pris-zap .lcell .row > span:first-child{padding-right:0;}
}
/* okno zaposlenega */
.okno .okno-kartica .pris-badge{display:inline-block;position:static;transform:none;margin:8px 0 0;}
.okno .pris-zap-det{padding:16px 22px 20px;}
.pris-zap-dl,.okno-dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center;margin:0 0 16px;}
.pris-zap-dl dt,.okno-dl dt{font-size:.82rem;color:var(--mid);font-weight:500;}
.pris-zap-dl dd,.okno-dl dd{margin:0;font-size:.92rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums;word-break:break-word;}
.pris-zap-act{display:flex;flex-wrap:wrap;gap:8px;}
@media(max-width:560px){.okno .pris-zap-det{padding:12px 16px 16px;}.pris-zap-act{display:grid;grid-template-columns:1fr 1fr;}.pris-zap-act .cgrp-btn{width:100%;justify-content:center;}}

/* ══════════ UPORABNIKI: okvirčki (Seznam / Mreža) + okno ══════════ */
.u-mreza .lcell:last-child .row{margin-bottom:0;}
.u-off .row{opacity:.55;}
.u-znacke{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.u-znacke .pill{margin-left:0;}
html[data-view="grid"] .u-mreza .u-znacke{flex-wrap:nowrap;overflow:hidden;align-self:flex-start;max-width:100%;}
html[data-view="grid"] .u-mreza .u-znacke .pill{font-size:.64rem;padding:1px 7px;}
html[data-view="grid"] .u-mreza .u-znacke .u-vi{display:none;}   /* v okvirčku ni prostora; v oknu je */
html[data-view="grid"] .u-mreza .row .num::before{content:"prijava ";color:var(--mid);}
html[data-view="list"] .u-mreza .lcell .row > span:first-child{padding-right:0;}
.okno .u-det{padding:16px 22px 20px;}
.okno .u-det .u-role-wrap{margin:0 0 14px;}
.okno .okno-kartica .u-znacke{margin-top:8px;}
@media(max-width:560px){.okno .u-det{padding:12px 16px 16px;}}

/* ══════════ ENOTNA GLAVA PODSTRANI (vzor: Dokumenti) ══════════
   Naslov zgoraj, tik pod njim ena strnjena orodna vrstica, poravnana levo:
   iskanje → glavni gumb → drugotni gumbi → filtri. Prej so bili filtri ponekod
   desno ob naslovu, gumbi za dodajanje pa v ločeni vrstici niže. */
.main .head{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:18px;margin-bottom:22px;}
.head .filtri{flex-wrap:wrap;justify-content:flex-start;height:auto!important;}
.head .filtri .btn,.head .filtri .btn-narrow{white-space:nowrap;padding:0 20px;width:auto;}
.tb-grupa{display:contents;}
.tb-grupa.hidden{display:none!important;}
/* Telefon: dva stolpca — iskanje in obdobje čez celo širino, gumbi in izbirniki po dva v vrsti. */
@media(max-width:760px){
  .head .filtri{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
  .head .filtri > input[type=search],.head .filtri > .arh-obd,.head .filtri > .fak-obd{grid-column:1 / -1;}
  .head .filtri .btn,.head .filtri .btn-narrow{width:100%;min-width:0;padding:0 12px;font-size:.9rem;}
  .head .filtri .cs,.head .filtri select{max-width:none;width:100%;min-width:0;}
  .head .filtri .dok-tbtn{width:100%;}
}

/* ═══ razširitve aplikacije (aplikacija/app.css) ═══ */
/* ══════════════════════════════════════════════════════════════════════
   SmartClean — aplikacija za spremne liste: RAZŠIRITVE portal.css
   zgradi.py pred to datoteko vstavi celoten portal.css (brez @font-face,
   pisave so vgrajene), zato so vse komponente iste kot v portalu:
   orodna vrstica, glava strani, kartice .a-row, okno, .ur-form, .u-acts,
   .sc-modal, .sc-toast, prijava s profili. Tu je SAMO, česar portal nima.
   ══════════════════════════════════════════════════════════════════════ */

/* aplikacija nima stranskega menija: vsebina čez celo širino, kot razdelek portala */
.ap .main{width:100%;}

/* stanje prenosa v orodni vrstici (enaka pika kot pri obvestilih) */
.ap .notif-dot{display:block;}
.ap .notif-dot.warn{background:var(--st-warn);}
.ap .notif-dot.bad{background:var(--st-bad);}
.ap .notif-dot.ok{background:var(--st-ok);}
.ap #syncBtn.vrti svg{animation:apVrti 1s linear infinite;}
@keyframes apVrti{to{transform:rotate(360deg)}}

/* oznaka na kartici: list še ni v portalu / številka zasedena (v slogu .a-izr) */
.a-caka,.a-zas{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:100px;font-size:.66rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em;vertical-align:middle;white-space:nowrap;border:1px solid currentColor;background:transparent;}
.a-caka{color:var(--st-warn);}
.a-zas{color:var(--st-bad);}
.arh-chk{cursor:default;}
/* telefon, seznam: portal tu skrije stranko — v aplikaciji je bistvena, zato gre pod številko */
@media(max-width:760px){
  html[data-view="list"] .ap .a-row{grid-template-columns:32px minmax(0,1fr) auto 20px;grid-template-areas:"chk num foot chev" "chk cli foot chev";row-gap:2px;}
  html[data-view="list"] .ap .a-row .arh-chk{grid-area:chk;}
  html[data-view="list"] .ap .a-row .a-num{grid-area:num;}
  html[data-view="list"] .ap .a-row .a-cli{grid-area:cli;display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.86rem;color:var(--mid);}
  html[data-view="list"] .ap .a-row .a-foot{grid-area:foot;}
  html[data-view="list"] .ap .a-row .chev{grid-area:chev;}
}
.ap-vec{display:flex;justify-content:center;margin-top:6px;}
.ap-vec:empty{display:none;}
.ap-noga{text-align:center;margin-top:18px;}

/* obrazec: postavke s premade seznamom (ime + količina); količina = polje iz portala */
.ur-post.ap-post{grid-template-columns:minmax(0,1fr) 92px;}
.ap-pn{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:.9rem;
  min-height:38px;display:flex;align-items:center;min-width:0;}
.ap-pn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ur-post.ap-post.polno .ap-pn{border-color:var(--green-l);}
.ur-post.ap-post input[data-pk]{cursor:pointer;}
.ur-post.ap-post input[data-pk]::placeholder{color:var(--mid);font-weight:400;}
.ap-prazno-art{padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center;}

/* številčnica za količino (tablica): okno .sc-modal iz portala, tipke v slogu gumbov portala */
.sc-modal.ap-kp{max-width:380px;}
.ap-kp-disp{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;margin:4px 0 14px;padding:10px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--bg);font-size:2.2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;}
.ap-kp-disp.prazen{color:var(--mid);}
.ap-kp-disp small{font-size:.9rem;font-weight:500;color:var(--mid);}
.ap-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.ap-key{height:58px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:1.4rem;font-weight:500;
  font-variant-numeric:tabular-nums;cursor:pointer;transition:background .12s,border-color .12s,transform .08s;}
.ap-key:hover{border-color:var(--mid);}
.ap-key:active{background:var(--green-m);transform:scale(.97);}
.ap-key.util{color:var(--mid);font-size:1.1rem;}
.ap-key.prazna{visibility:hidden;}

/* PIN (nastavi se v portalu, Moj račun) — v prostoru prijave, kot izbira profila */
.ap-pin{text-align:center;width:100%;max-width:320px;}
.ap-pin .pp-av{margin:0 auto 12px;}
.ap-pin h1{margin-bottom:4px;font-size:1.1rem;font-weight:600;letter-spacing:0;}
.ap-pin .sub{margin-bottom:22px;}
.ap-pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:24px;}
.ap-pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--mid);transition:background .12s,border-color .12s;}
.ap-pin-dot.on{background:var(--ink);border-color:var(--ink);}
.ap-pin .ap-keys{gap:12px;}
.ap-pin .ap-key{height:62px;border-radius:14px;}
.ap-pin.tresi .ap-pin-dots{animation:apTresi .32s ease;}
/* nizek zaslon (telefon): brez slogana, da so vse tipke vidne brez drsenja */
@media(max-height:900px){.ap-pin-on .auth-hero{display:none;}.ap-pin-on .auth-main{grid-template-rows:auto;align-content:center;}}
@keyframes apTresi{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

@media(max-width:560px){
  .ap-key{height:54px;}
  .ur-post.ap-post{grid-template-columns:minmax(0,1fr) 84px;}
}
</style>
</head>

<script>(function(){
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   SmartClean — spremni listi (tablica + splet), ena koda za obe različici.
   Različico vstavi zgradi.py; kar je odvisno od naprave (tiskanje, PDF v
   Datoteke, izklop), se ugotovi med tekom (Capacitor na tablici).

   Vmesnik = portal: portal.css, isti vzorci kot v Arhivu portala (kartice
   .a-row, okno, ki zraste iz kartice, obrazec »Nov spremni list«, potrditve
   .sc-modal, predogled dokumenta). Okno je prenos oknoOdpri iz portal.js.

   Podatki ostanejo v istih ključih kot v prejšnjih različicah (pralnica:*).
   ══════════════════════════════════════════════════════════════════════ */
var VARIANTA = "tablica", APP_VERZIJA = "9.1";
var LASTNIK = "filip@eflitte.si";
var DOK_BIZ = ["BSMART d.o.o.", "Škalska cesta 6, 3210 Slovenske Konjice", "+386 41 209 676", "+386 68 693 988", "blanka.kovacic1@gmail.com"];
var PRIVZETI_PORTAL = "https://anrhtgbckxrccnafcmsz.supabase.co";
var PRIVZETI_KLJUC = "sb_publishable_LYMbUOYW2IFz4NxgvjXLOg_PJ2-qpS4";   // javni ključ (RLS varuje podatke)

function $(id){ return document.getElementById(id); }

/* ══════════ SHRAMBA ══════════
   Tablica: Capacitor Filesystem (Documents — ostane tudi ob ponovni namestitvi).
   Splet: localStorage. */
var STORE_KEY = "pralnica:entries", CLIENTS_KEY = "pralnica:clients_v3", SETTINGS_KEY = "pralnica:settings",
    PROFILES_KEY = "pralnica:profiles", PORTAL_AUTH_KEY = "pralnica:portal_auth";
var LS = (function(){ try{ var k = "__t"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
var shrambaZaklenjena = false;   // tablica brez dovoljenja za datoteke → NE pišemo (ne prepišemo starih podatkov s praznimi)

function jeNativno(){ try{ return !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()); }catch(e){ return false; } }
function capFS(){
  try{ if(jeNativno() && Capacitor.Plugins && Capacitor.Plugins.Filesystem) return Capacitor.Plugins.Filesystem; }catch(e){}
  return null;
}
function fileFor(key){ return key.replace(/[^a-z0-9]+/gi, "_") + ".json"; }
function dbRead(key){
  var FS = capFS();
  if(FS){
    return FS.readFile({ path: fileFor(key), directory: "DOCUMENTS", encoding: "utf8" })
      .then(function(r){ return r && r.data != null ? r.data : null; })
      .catch(function(e){
        /* »datoteke ni« je običajno (prvi zagon); »ni dovoljenja« pa pomeni, da podatki SO, a jih ne vidimo */
        if(/EACCES|denied|permission/i.test(String((e && e.message) || e || ""))) shrambaZaklenjena = true;
        return null;
      });
  }
  if(LS){ try{ return Promise.resolve(localStorage.getItem(key)); }catch(e){} }
  return Promise.resolve(null);
}
function dbWrite(key, val){
  if(shrambaZaklenjena) return Promise.resolve(false);
  var FS = capFS();
  if(FS){
    return FS.writeFile({ path: fileFor(key), directory: "DOCUMENTS", encoding: "utf8", data: val, recursive: true })
      .then(function(){ return true; }).catch(function(){ return false; });
  }
  if(LS){ try{ localStorage.setItem(key, val); return Promise.resolve(true); }catch(e){} }
  return Promise.resolve(false);
}
async function dbJson(key, privzeto){ try{ var v = await dbRead(key); return v ? JSON.parse(v) : privzeto; }catch(e){ return privzeto; } }

/* Dnevna varnostna kopija (ena datoteka na dan, zadnjih 30 dni). Prej je nastala nova
   kopija CELEGA arhiva ob vsakem shranjenem listu — tisoče datotek na leto. */
var _varnostnaDan = "";
async function writeBackup(){
  var FS = capFS(); if(!FS || shrambaZaklenjena) return;
  var dan = todayISO();
  try{ await FS.writeFile({ path: "backup/spremni_listi_dan_" + dan + ".json", directory: "DOCUMENTS", encoding: "utf8", data: JSON.stringify(entries), recursive: true }); }catch(e){}
  if(_varnostnaDan === dan) return; _varnostnaDan = dan;
  try{
    var meja = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
    var r = await FS.readdir({ path: "backup", directory: "DOCUMENTS" });
    var imena = ((r && r.files) || []).map(function(f){ return typeof f === "string" ? f : (f && f.name) || ""; });
    for(var i = 0; i < imena.length; i++){
      var m = /^spremni_listi_dan_(\d{4}-\d{2}-\d{2})\.json$/.exec(imena[i]);   // samo lastne dnevne kopije
      if(m && m[1] < meja){ try{ await FS.deleteFile({ path: "backup/" + imena[i], directory: "DOCUMENTS" }); }catch(e){} }
    }
  }catch(e){}
}

/* ══════════ STANJE ══════════ */
var CLIENTS = [], entries = [], settings = {}, savedProfs = [], session = null, idleTimer = null;
var osnutek = null;               // nov spremni list v pripravi (ostane, če okno zapreš s ×)
var urejanje = null;              // {id, …} urejanje obstoječega lista v oknu
var iskanje = "", filterStranka = "", filterDatum = "", prikazano = 60;
var pdfPermOK = false, askedPerm = false;
var DOTIK = (function(){ try{ return matchMedia("(pointer: coarse)").matches; }catch(e){ return false; } })();   // tablica/telefon → številčnica

async function loadEntries(){ entries = await dbJson(STORE_KEY, []); if(!Array.isArray(entries)) entries = []; }
async function saveEntries(){ try{ await dbWrite(STORE_KEY, JSON.stringify(entries)); }catch(e){} }
async function loadClients(){ CLIENTS = await dbJson(CLIENTS_KEY, []); if(!Array.isArray(CLIENTS)) CLIENTS = []; }
async function saveClients(){ try{ await dbWrite(CLIENTS_KEY, JSON.stringify(CLIENTS)); }catch(e){} }
async function loadSettings(){
  settings = await dbJson(SETTINGS_KEY, {}); if(!settings || typeof settings !== "object") settings = {};
  settings.idleMin = 15;
  if(!settings.theme) settings.theme = "dark";
  if(!settings.portalUrl) settings.portalUrl = PRIVZETI_PORTAL;
  if(!settings.portalKey) settings.portalKey = PRIVZETI_KLJUC;
}
async function saveSettings(){ await dbWrite(SETTINGS_KEY, JSON.stringify(settings)); }
async function loadProfs(){ savedProfs = await dbJson(PROFILES_KEY, []); if(!Array.isArray(savedProfs)) savedProfs = []; }
async function saveProfs(){ try{ await dbWrite(PROFILES_KEY, JSON.stringify(savedProfs)); }catch(e){} }

/* ══════════ POMOŽNE ══════════ */
function todayISO(){ var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fmtDateHuman(iso){ if(!iso) return "—"; var p = String(iso).slice(0, 10).split("-"); return p[2] + ". " + p[1] + ". " + p[0]; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function stevilo(n){ return Number(n || 0).toLocaleString("sl-SI"); }
function tezaFmt(kg){   // enako kot v portalu: max 2 decimalki, vejica, nad 1000 kg v tonah
  kg = Math.round((Number(kg) || 0) * 100) / 100;
  var v, u; if(kg >= 1000){ v = kg / 1000; u = "t"; }else{ v = kg; u = "kg"; }
  return v.toFixed(2).replace(/0+$/, "").replace(/\.$/, "").replace(".", ",") + u;
}
function sklon(n, e1, e2, e34, e5){ var m = Math.abs(n) % 100; return m === 1 ? e1 : m === 2 ? e2 : (m === 3 || m === 4) ? e34 : e5; }
function sklonListov(n){ return stevilo(n) + " " + sklon(n, "spremni list", "spremna lista", "spremni listi", "spremnih listov"); }
function clientById(id){ return CLIENTS.find(function(c){ return c.id === id; }); }
function entryById(id){ return entries.find(function(x){ return x.id === id; }); }
function strankeUrejene(){ return CLIENTS.slice().sort(function(a, b){ return String(a.naziv || "").localeCompare(String(b.naziv || ""), "sl"); }); }
function stKljuc(e){ var p = String(e.stevilka || "").split("/"); return (parseInt(p[1], 10) || 0) * 100000 + (parseInt(p[0], 10) || 0); }
/* Naslednja številka: največja letošnja (lokalni + iz portala prenesen arhiv) + 1. */
function nextNumber(){
  var y = new Date().getFullYear(), max = 0;
  entries.forEach(function(e){ var p = String(e.stevilka || "").split("/"); if(p[1] == String(y)){ var s = parseInt(p[0], 10); if(!isNaN(s) && s > max) max = s; } });
  return String(max + 1).padStart(4, "0") + "/" + y;
}
function jeZaklenjen(e){ return !!(e && (e.potrjeno || e.zaklenjen)); }
function lahkoBrise(e){ return !(e.syncedAt || e.prenesenIzPortala || e.potrjeno); }

/* ══════════ OBVESTILO (portal: .sc-toast) ══════════ */
function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 2600); }

/* ══════════ POTRDITEV (portal: potrdiModal, .sc-modal) ══════════ */
var _modalFokus = null;
function potrdiModal(opts){
  opts = opts || {};
  return new Promise(function(resolve){
    _modalFokus = document.activeElement;
    var back = document.createElement("div"); back.className = "sc-modal-back";
    back.innerHTML = '<div class="sc-modal" role="dialog" aria-modal="true"><h4></h4><p></p><div class="sc-modal-acts"><button type="button" class="sc-modal-btn ghost" data-no></button><button type="button" class="sc-modal-btn ' + (opts.nevarno ? "danger" : "primary") + '" data-yes></button></div></div>';
    back.querySelector("h4").textContent = opts.naslov || "Potrditev";
    back.querySelector("p").textContent = opts.sporocilo || "";
    back.querySelector("[data-no]").textContent = opts.preklici || "Prekliči";
    back.querySelector("[data-yes]").textContent = opts.potrdi || "Potrdi";
    document.body.appendChild(back);
    requestAnimationFrame(function(){ back.classList.add("show"); });
    var done = false;
    function zapri(val){ if(done) return; done = true; back.classList.remove("show"); document.removeEventListener("keydown", onKey, true);
      setTimeout(function(){ if(back.parentNode) back.parentNode.removeChild(back); }, 180);
      try{ if(_modalFokus && _modalFokus.focus) _modalFokus.focus({ preventScroll: true }); }catch(_){}
      resolve(val); }
    function onKey(e){ if(e.key === "Escape"){ e.stopPropagation(); zapri(false); } else if(e.key === "Enter"){ e.preventDefault(); zapri(true); } }
    back._zapri = function(){ zapri(false); };

function stevilcnica(opts){

        if(k === "C") return '<button type="button" class="ap-key util" data-k="C" aria-label="Počisti">C</button>';
        if(k === "del") return '<button type="button" class="ap-key util" data-k="del" aria-label="Briši">⌫</button>';

    back.querySelector("[data-yes]").addEventListener("click", function(e){ e.stopPropagation(); zapri(buf === "" ? 0 : parseInt(buf, 10) || 0); });

function opisiSpremembe(stare, nova, sKg, nKg, sPre, nPre){
  var mapS = {}, mapN = {}, imena = {};
  (stare || []).forEach(function(p){ mapS[p.naziv] = (mapS[p.naziv] || 0) + (p.kosov || 0); imena[p.naziv] = 1; });
  (nova || []).forEach(function(p){ mapN[p.naziv] = (mapN[p.naziv] || 0) + (p.kosov || 0); imena[p.naziv] = 1; });
  var deli = [];

    if(a !== b){ if(a === 0) deli.push("+" + nm + " " + b); else if(b === 0) deli.push("−" + nm + " (" + a + ")"); else deli.push(nm + " " + a + "→" + b); } });

  if((sPre || "redni") !== (nPre || "redni")) deli.push("prevoz " + (sPre === "izredni" ? "izredni" : "redni") + "→" + (nPre === "izredni" ? "izredni" : "redni"));

/* številka je v portalu zasedena z drugim listom → predlagaj prosto (portal + naprava) */
async function novaStevilka(id){
  var e = entryById(id); if(!e) return;
  var leto = String(e.stevilka).split("/")[1] || String(new Date().getFullYear());
  var izPortala = 0;
  try{ var r = await api("rpc/app_prosta_stevilka", { method: "POST", body: { p_leto: parseInt(leto, 10) } }); if(typeof r === "number") izPortala = r; }catch(_){}
  var maxLok = 0; entries.forEach(function(x){ var p = String(x.stevilka || "").split("/"); if(p[1] === leto){ var s = parseInt(p[0], 10); if(!isNaN(s) && s > maxLok) maxLok = s; } });
  var nova = String(Math.max(izPortala, maxLok + 1)).padStart(4, "0") + "/" + leto;
  var ok = await potrdiModal({ naslov: "Nova številka lista?", sporocilo: "Številka " + e.stevilka + " je v portalu že zasedena z drugim spremnim listom. Ta list dobi številko " + nova + ". Na natisnjenem listu popravi številko ali ga natisni znova.", potrdi: "Spremeni v " + nova });
  if(!ok) return;
  await renameEntryNumber(id, nova);
  e.stevilkaZasedena = false; e.syncNapaka = null; await saveEntries();
  renderList(); osveziDetajl(e);
  try{ syncPush(false); }catch(_){}
}
async function renameEntryNumber(id, nn){
  var e = entryById(id); if(!e || nn === e.stevilka) return;
  if(entries.some(function(x){ return x.id !== id && x.stevilka === nn; })){ toast("Ta številka že obstaja."); return; }
  var P = pdfPlugin(); if(P && e.pdfSaved){ try{ await P.deleteFile({ relPath: SINHRO + pdfName(e) }); }catch(err){} }
  e.stevilka = nn; e.pdfSaved = false;
  await saveEntries();
  if(e.saved) await savePdfs(e);
  toast("Številka spremenjena v " + nn);
}
/* po osvežitvi kataloga / artiklov iz portala: odprt obrazec in filter naj pokažeta sveže */
function poKatalogu(){
  napolniFilterStrank();
  var v = _okno && _okno.vsebina;
  if(v && v._d){
    var sel = v.querySelector("[data-org]"), izbrana = v._d.stranka;
    if(sel && !sel.disabled){
      sel.innerHTML = '<option value="">— izberi stranko —</option>' + strankeUrejene().map(function(c){ return '<option value="' + esc(c.id) + '">' + esc(c.naziv) + '</option>'; }).join("");
      sel.value = clientById(izbrana) ? izbrana : "";
    }
    risiPostavke(v, v._d);
  }
}
function poArtiklih(cid){ var v = _okno && _okno.vsebina; if(v && v._d && v._d.stranka === cid) risiPostavke(v, v._d); }

  ".a4{position:relative;padding:12mm 12mm 14mm;color:#0a0a0a;background:#fff;min-height:297mm;break-after:page}" +
  ".a4:last-child{break-after:auto}.a4+.a4{margin-top:14px}" +
  "@media print{html,body{background:#fff}.a4{min-height:0}.a4+.a4{margin-top:0}}" +
  ".sc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;padding-bottom:14px;border-bottom:1.5px solid #0a0a0a}" +
  ".sc-wm{font-family:'Playfair Display',serif;font-weight:700;letter-spacing:-.03em;line-height:.9;font-size:32px;color:#0d1f17;white-space:nowrap}" +

  ".sc-client{display:flex;justify-content:space-between;gap:14px}.sc-client .cl{font-size:12px}" +
