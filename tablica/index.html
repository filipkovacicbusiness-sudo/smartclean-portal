.art-add .art-id-new{flex:0 0 128px;width:128px;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;
  background:var(--bg);font-family:var(--mono);text-transform:uppercase;}
.art-add .art-id-new:focus{border-color:var(--green-l);outline:none;}
@media(max-width:600px){ .art-add .art-id-new{flex:1 1 auto;width:auto;} }
/* urejanje artikla (naziv + ID) */
.art-edit{display:flex;flex-direction:column;gap:8px;width:100%;}
.art-edit .art-ren-in{width:100%;padding:8px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);}
.art-edit-r{display:flex;gap:8px;align-items:center;}
.art-edit-r .art-id-in{flex:1;min-width:0;padding:8px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--mono);text-transform:uppercase;}
.art-edit .art-ren-in:focus,.art-edit-r .art-id-in:focus{border-color:var(--green-l);outline:none;}

/* ID pill z določenim ID-jem rahlo obarvan (privzeta bela/črna); »brez ID« ostane kot je */
.art-id:not(.art-id-none){
  background:rgba(var(--brand-rgb),.08);
  border-color:rgba(var(--brand-rgb),.38);
  color:var(--ink);
}

/* ── Izbirnik obstoječih artiklov (deljeni katalog) ───────────────── */
.cenik-pick{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);}
.cenik-pick-in{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);margin-bottom:8px;}
.cenik-pick-in:focus{border-color:var(--green-l);outline:none;}
.cenik-pick-list{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:4px;}
.cenik-pick-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;
  padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;transition:.12s;}
.cenik-pick-item:hover{border-color:var(--green-l);background:var(--green-m);}
.cenik-pick-item .pk-id{font-family:var(--mono);font-size:.74rem;color:var(--mid);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap;}
.cenik-pick-item .pk-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cenik-pick-item .pk-c{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mid);}

/* v mreži naj se odprta skupina razširi (drugače je vsebina odrezana zaradi fiksne višine) */
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp.open{height:auto;overflow:visible;grid-column:1 / -1;}

/* ── Ura in datum na sredini glave ────────────────────────────────── */
.topbar-in{position:relative;}
.clock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;line-height:1.1;pointer-events:none;text-align:center;}
.clock .clk-time{font-family:var(--mono);font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:.02em;}
.clock .clk-date{font-size:.7rem;color:var(--mid);text-transform:capitalize;margin-top:1px;}
@media(max-width:680px){ .clock{display:none;} }

/* v mreži naj se odprta stranka razširi čez celo širino (drugače je vsebina stisnjena/odrezana) */
html[data-view="grid"] .rows .lcell.open{grid-column:1 / -1;}
html[data-view="grid"] .lcell.open .row,
html[data-view="grid"] .lcell.open .a-row{height:auto;}
html[data-view="grid"] .lcell.open .row > span:first-child{height:auto;}
/* razširjen spremni list v mreži: postavke v več stolpcih glede na širino (brez prekrivanja) */
html[data-view="grid"] .lcell.open .a-det ul{columns:auto;column-width:220px;}

/* Stranke/Arhiv v mreži: vsebino kartice navpično centriraj (kot pri Ceniku) */
html[data-view="grid"] .lcell:not(.open) .row,
html[data-view="grid"] .lcell:not(.open) .a-row{align-content:center;}

/* ── Splošni cenik: značka + izoliran videz kartice ────────────── */
/* Isti videz kot .pill (vloge v Uporabnikih): mehka siva podlaga, brez obrobe, navadne črke. */
.sc-tag{display:inline-block;align-self:flex-start;max-width:max-content;margin-left:8px;padding:2px 9px;border-radius:100px;
  font-size:.72rem;font-weight:500;line-height:1.35;
  vertical-align:middle;white-space:nowrap;
  background:var(--green-m);color:var(--ink);}
.cgrp.splosni{border:1px solid rgba(var(--brand-rgb),.38);
  background:rgba(var(--brand-rgb),.035);}
.cgrp.splosni .cgrp-name{font-weight:700;}
.art-splbar{margin-top:6px;}
.art-splbar .art-spl-btn{width:100%;justify-content:center;}

/* Značka »Splošni cenik«: v svoji vrstici POD polnim imenom, poravnana LEVO */
.cgrp-name .sc-tag{margin-left:0;margin-top:2px;}
.row .sc-tag{margin-left:0;margin-top:4px;}
html[data-view="grid"] .row .sc-tag{display:block;margin-top:4px;}
html[data-view="grid"] .row.has-sc > span:first-child,html[data-view="grid"] .row.has-tag > span:first-child{height:auto;}
/* Preklop splošnega cenika v Ceniki */
.sc-toggle.on{background:rgba(var(--brand-rgb),.10);border-color:rgba(var(--brand-rgb),.38);color:var(--ink);opacity:1;}
/* Vrstica za dodajanje v kartico Splošni cenik — poravnaj z vsebino kartice, brez prelivanja */
.sc-add{margin-top:0;padding:12px 16px 14px;box-sizing:border-box;width:100%;align-items:center;}
.sc-add .sc-new,.sc-add .sc-id-new,.sc-add .sc-add-btn{height:40px;box-sizing:border-box;}
.sc-add .sc-add-btn{padding-top:0;padding-bottom:0;display:inline-flex;align-items:center;justify-content:center;}
.sc-add .sc-new{flex:1;min-width:0;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:.9rem;}
.sc-add .sc-id-new{flex:0 0 110px;width:110px;min-width:0;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:.9rem;font-family:var(--mono);}
.sc-add .sc-new:focus,.sc-add .sc-id-new:focus{border-color:var(--green-l);outline:none;}
@media(max-width:560px){ .sc-add{flex-direction:column;align-items:stretch;} .sc-add .sc-id-new{flex:1 1 auto;width:auto;} .sc-add .sc-add-btn{width:100%;} }

/* Vklop/izklop vidnosti artikla v aplikaciji (tablici) */
.art-vis{border:1px solid var(--line);background:var(--surface);color:var(--mid);width:28px;height:28px;border-radius:7px;cursor:pointer;line-height:1;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;}
.art-vis:hover{border-color:var(--mid);color:var(--ink);}
.art-vis.off{color:#c0392b;border-color:rgba(192,57,43,.4);}
html[data-theme="dark"] .art-vis.off{color:#ff8a7a;border-color:rgba(255,138,122,.4);}
.art-ur li.art-off{opacity:.5;}
.art-ur li.art-off .art-nm{text-decoration:line-through;}
.art-hidden-tag{display:inline-block;margin-left:8px;padding:0 7px;border-radius:100px;font-size:.62rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:rgba(192,57,43,.12);color:#c0392b;border:1px solid rgba(192,57,43,.35);}
html[data-theme="dark"] .art-hidden-tag{background:rgba(255,138,122,.14);color:#ff8a7a;border-color:rgba(255,138,122,.4);}

/* Naziv stranke: ena vrstica (maska) + drseči trak ob hoverju (kot glasbene aplikacije) */
.row-name{display:block;max-width:100%;overflow:hidden;white-space:nowrap;}
.row-nm{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;transition:transform .8s ease;will-change:transform;}

/* Potrditveno okno v portalu (namesto brskalnikovega confirm) */
.sc-modal-back{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.42);opacity:0;transition:opacity .18s ease;}
.sc-modal-back.show{opacity:1;}
.sc-modal{width:100%;max-width:420px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;box-shadow:0 24px 70px rgba(0,0,0,.28);transform:translateY(10px) scale(.98);transition:transform .18s ease;}
.sc-modal-back.show .sc-modal{transform:none;}
.sc-modal h4{margin:0 0 8px;font-size:1.06rem;font-weight:700;}
.sc-modal p{margin:0 0 18px;color:var(--mid);font-size:.92rem;line-height:1.5;white-space:pre-line;}
.sc-modal-input{width:100%;margin:0 0 18px;padding:10px 13px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:16px;font-family:var(--sans);}
.sc-modal-input:focus{border-color:var(--green-l);outline:none;}
.sc-modal-acts{display:flex;gap:10px;justify-content:flex-end;}
.sc-modal-btn{padding:9px 17px;border-radius:100px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:.9rem;font-weight:600;}
.sc-modal-btn.ghost:hover{border-color:var(--mid);}
.sc-modal-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.sc-modal-btn.danger{background:#c0392b;color:#fff;border-color:#c0392b;}
.sc-modal-btn.danger:hover{background:#a93226;}
.sc-modal-acts.one{justify-content:center;}
.sc-modal-acts.one .sc-modal-btn{min-width:150px;text-align:center;justify-content:center;}
/* Pojavno obvestilo iz konzole (na sredini, z gumbom V redu) */
.sc-modal-obv{max-width:400px;text-align:center;padding:26px 24px 20px;}
.sc-modal-obv .obvm-ic{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;margin:0 auto 12px;border-radius:50%;background:var(--green-m);color:var(--ink);}
.sc-modal-obv .obvm-ic svg{width:24px;height:24px;}
.sc-modal-obv h4{margin:0 0 6px;font-size:1.12rem;}
.sc-modal-obv p{margin:0 0 20px;color:var(--mid);white-space:pre-line;}
/* Sekundarni gumb (npr. izvoz) — obris namesto polnila */
.btn-alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn-alt:hover:not(:disabled){background:var(--green-m);border-color:var(--mid);}
/* Izvoz — pojavno okno z izbiro obdobja in strank */
.sc-modal-wide{max-width:520px;}
.fx-dates{display:flex;gap:12px;margin:0 0 16px;}
.fx-dates label{flex:1;display:flex;flex-direction:column;font-size:.78rem;font-weight:600;color:var(--mid);}
.fx-dates .sc-modal-input{margin:6px 0 0;}
.fx-cli-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px;font-size:.82rem;font-weight:700;color:var(--ink);}
.fx-all{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;font-weight:600;color:var(--ink);cursor:pointer;}
.fx-cli-list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px;margin:0 0 12px;display:flex;flex-direction:column;gap:2px;}
.fx-cli{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:.9rem;color:var(--ink);cursor:pointer;}
.fx-cli:hover{background:var(--green-m);}
.fx-cli input,.fx-all input{width:16px;height:16px;accent-color:var(--ink);cursor:pointer;flex:0 0 auto;margin:0;}
.fx-msg{margin:0 0 8px;}
.fak-body-acts{margin-top:14px;display:flex;justify-content:flex-end;}
.fak-body-acts .btn-mini{padding:10px 20px;border:none;border-radius:100px;background:var(--green);color:var(--btn-ink);font-size:.85rem;font-weight:600;line-height:1;cursor:pointer;white-space:nowrap;transition:background .15s,opacity .15s;}
.fak-body-acts .btn-mini:hover{background:var(--green-l);}
/* Predogled dokumenta (skupni pop-up: scrollable predogled + natisni/shrani) */
.doc-modal{max-width:880px;width:100%;max-height:92vh;display:flex;flex-direction:column;padding:16px 16px 14px;}
.doc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;}
.doc-head h4{margin:0;font-size:1.02rem;font-weight:700;}
.doc-x{border:1px solid var(--line);background:var(--surface);color:var(--mid);width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.doc-x:hover{color:var(--ink);border-color:var(--ink);}
.doc-stage{flex:1;min-height:0;height:70vh;background:#e9edeb;border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto;display:flex;align-items:flex-start;justify-content:center;}
.doc-scaler{position:relative;flex:0 0 auto;margin:0 auto;}
.doc-frame{border:none;border-radius:2px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.18);display:block;}
.doc-acts{margin-top:14px;}
@media(max-width:720px){.doc-stage{height:64vh;}.doc-modal{max-height:94vh;padding:12px;}}

/* ── Enotni spustni meniji (custom select) po standardu portala ─────────── */
.cs{position:relative;display:block;width:100%;}
.cs-native{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;margin:0;pointer-events:none;}
.cs-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 14px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:1rem;line-height:1.2;text-align:left;cursor:pointer;min-width:0;}
.cs-open .cs-trigger,.cs-trigger:focus{border-color:var(--green-l);outline:none;}
.cs-val{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* narisana ↓/↑ (csNapis) — sredina puščice na sredini velikih črk, ne na osnovni črti */
.cs-smer{display:inline-block;width:.9em;height:.9em;margin-left:.28em;vertical-align:-.1em;}
.cs-arr{flex:0 0 auto;color:var(--mid);display:inline-flex;transition:transform .18s ease;}
.cs-open .cs-arr{transform:rotate(180deg);}
.cs-panel{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:50;max-height:300px;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;
  box-shadow:0 18px 46px rgba(0,0,0,.20);}
.cs-opt{padding:9px 12px;border-radius:8px;font-family:var(--sans);font-size:.92rem;color:var(--ink);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cs-opt:hover{background:var(--green-m);}
.cs-opt.sel{background:var(--green-m);font-weight:600;}
.cs-opt.dis{color:var(--mid);cursor:default;}
/* konteksti */
.ur-form .cs-trigger{padding:9px 12px;font-size:.9rem;}
.filtri .cs{max-width:230px;}
.filtri .cs-trigger{height:44px;}

/* ── iPhone / iOS PWA: varna območja (Dynamic Island, home indikator) ──── */
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
/* vrstica na vrhu sega pod status vrstico (črno ozadje pod Dynamic Island) */
.topbar{padding-top:env(safe-area-inset-top);}
.topbar-in{padding-left:calc(24px + env(safe-area-inset-left));padding-right:calc(24px + env(safe-area-inset-right));}
.scrim{top:calc(64px + env(safe-area-inset-top));}
.auth{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
@media(max-width:900px){
  .side{top:calc(64px + env(safe-area-inset-top));padding-bottom:calc(40px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .side-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  .main{padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right));padding-bottom:calc(80px + env(safe-area-inset-bottom));}
}

/* ── Nastavitve: vrstni red menija (drag & drop) ─────────────────────── */
.menu-order-list{list-style:none;display:flex;flex-direction:column;gap:8px;max-width:420px;margin:0;padding:0;}
.menu-order-list li{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:default;}
.menu-order-list li .art-grip{cursor:grab;}
.menu-order-list .mo-ikona{display:inline-flex;align-items:center;color:var(--mid);}
.menu-order-list .mo-ikona svg{width:18px;height:18px;}
.menu-order-list .mo-ime{font-weight:500;color:var(--ink);}
.menu-order-list li.mo-locked{background:var(--green-m);}
.menu-order-list .mo-spacer{visibility:hidden;pointer-events:none;}
.menu-order-reset{margin-top:12px;}

/* ── Mreža: fiksne višine kategorij (ime/podnaslov/značka), predolgo → »…« ── */
/* STRANKE */
html[data-view="grid"] .lcell:not(.open) .row{display:flex;flex-direction:column;gap:3px;align-items:stretch;align-content:normal;min-width:0;text-align:left;}
html[data-view="grid"] .lcell:not(.open) .row > span:first-child{display:flex;flex-direction:column;gap:2px;align-items:stretch;height:auto;overflow:visible;min-width:0;max-width:100%;}
html[data-view="grid"] .lcell:not(.open) .row-name{height:1.4em;line-height:1.4;min-width:0;max-width:100%;text-align:left;}
html[data-view="grid"] .lcell:not(.open) .row-legal{display:block;height:1.3em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.76rem;min-width:0;max-width:100%;text-align:left;}
html[data-view="grid"] .lcell:not(.open) .row.has-sc > span:first-child,html[data-view="grid"] .lcell:not(.open) .row.has-tag > span:first-child{height:auto;}
html[data-view="grid"] .lcell:not(.open) .row .num{margin-top:auto;text-align:left;align-self:stretch;}
html[data-view="grid"] .lcell:not(.open) .row .sc-tag{margin-top:2px;align-self:flex-start;}
/* CENIKI */
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp-head-row,
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp-h{align-items:flex-start;}
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp-name{display:flex;flex-direction:column;gap:2px;justify-content:flex-start;min-width:0;max-width:100%;}
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp-nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:1.4em;line-height:1.4;font-weight:600;min-width:0;max-width:100%;}
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp-sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:1.3em;line-height:1.3;-webkit-line-clamp:none;min-width:0;max-width:100%;}
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp .sc-tag{margin-top:2px;}

/* ── Mreža: kot ⌄ v spodnjem desnem kotu; v Ceniki št. artiklov spodaj levo ── */
html[data-view="grid"] .lcell:not(.open) .row{position:relative;}
html[data-view="grid"] .lcell:not(.open) .row .chev{display:block;position:absolute;right:14px;bottom:12px;justify-self:auto;}
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp:not(.open){position:relative;}
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp:not(.open) .cgrp-count{position:absolute;left:16px;bottom:12px;z-index:2;}
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp:not(.open) .cgrp-chev{position:absolute;right:14px;bottom:12px;z-index:2;}

/* ═══ ENOTNE MREŽNE KARTICE: Stranke (.row) · Ceniki (.cgrp) · Arhiv (.a-row) ═══
   Isti font, velikost in pozicije elementov v vseh treh submenujih. */
html[data-view="grid"] .lcell:not(.open) .row,
html[data-view="grid"] .lcell:not(.open) .a-row,
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp:not(.open) .cgrp-h{
  position:relative;display:flex;flex-direction:column;gap:2px;
  padding:15px 16px;align-items:stretch;align-content:normal;text-align:left;min-width:0;box-sizing:border-box;}
/* Ceniki: glava naj napolni celotno višino kartice, da meritev/puščica sedeta na dno */
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp:not(.open) .cgrp-head-row{align-items:stretch;height:100%;}
/* prvi (ovojni) span pri Strankah in ime-skupina pri Cenikih = stolpec naslov+podnaslov */
html[data-view="grid"] .lcell:not(.open) .row > span:first-child,
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp:not(.open) .cgrp-name{
  display:flex;flex-direction:column;gap:2px;align-items:stretch;justify-content:flex-start;
  height:auto;overflow:visible;min-width:0;max-width:100%;}
/* ── Naslov ── */
html[data-view="grid"] .lcell:not(.open) .row-name,
html[data-view="grid"] .lcell:not(.open) .a-row .a-num,
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp:not(.open) .cgrp-nm{
  display:block;font-family:var(--sans);font-size:1rem;font-weight:600;line-height:1.4;height:1.4em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;color:var(--ink);text-align:left;}
/* ── Podnaslov ── */
html[data-view="grid"] .lcell:not(.open) .row-legal,
html[data-view="grid"] .lcell:not(.open) .a-row .a-cli,
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp:not(.open) .cgrp-sub{
  display:block;font-family:var(--sans);font-size:.76rem;font-weight:400;line-height:1.3;height:1.3em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:none;min-width:0;max-width:100%;color:var(--mid);text-align:left;}
/* ── Meritev spodaj levo ── */
html[data-view="grid"] .lcell:not(.open) .row .num,
html[data-view="grid"] .lcell:not(.open) .a-row .a-foot,
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp:not(.open) .cgrp-count{
  position:absolute;left:16px;bottom:12px;right:38px;margin:0;
  display:flex;gap:7px;align-items:baseline;
  font-family:var(--mono);font-size:.76rem;font-weight:400;color:var(--mid);text-align:left;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;align-self:auto;}
html[data-view="grid"] .lcell:not(.open) .a-row .a-foot .num{font-size:.76rem;color:var(--mid);text-align:left;font-weight:400;}
/* Noga ploščice: od leve (osnovno pravilo .a-foot jo poravna desno — ob dolgem imenu izdajatelja
   je zato odrezalo datum na levi). Datum in količina ostaneta cela, ime se skrajša s »…«. */
html[data-view="grid"] .lcell:not(.open) .a-row .a-foot{justify-content:flex-start;}
html[data-view="grid"] .lcell:not(.open) .a-row .a-foot .a-date,
html[data-view="grid"] .lcell:not(.open) .a-row .a-foot .a-qty{flex:none;}
html[data-view="grid"] .lcell:not(.open) .a-row .a-foot .a-izdal{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;}
html[data-view="grid"] .lcell:not(.open) .a-row .a-foot .a-qty::before{content:'· ';}
/* ── Puščica spodaj desno ── */
html[data-view="grid"] .lcell:not(.open) .row .chev,
html[data-view="grid"] .lcell:not(.open) .a-row .chev,
html[data-view="grid"] :is(#cenikList,.art-skupine) .cgrp:not(.open) .cgrp-chev{
  display:block;position:absolute;right:14px;bottom:10px;left:auto;
  font-size:19px;line-height:1;color:var(--mid);justify-self:auto;z-index:2;}
/* skrij delež pri Strankah in podvojene elemente */
html[data-view="grid"] .lcell:not(.open) .row-pct{display:none;}

/* ── Splošni cenik izoliran nad skupno mrežo strank ── */
:is(#cenikList,.art-skupine) .sc-isolate{margin-bottom:14px;padding-bottom:16px;border-bottom:1px solid var(--line);}
:is(#cenikList,.art-skupine) .cenik-sec-head{font-size:.8rem;font-weight:600;color:var(--mid);letter-spacing:.02em;margin:2px 0 10px;}
html[data-view="grid"] :is(#cenikList,.art-skupine) .sc-isolate,
html[data-view="grid"] :is(#cenikList,.art-skupine) .cenik-sec-head{grid-column:1 / -1;}
html[data-view="grid"] :is(#cenikList,.art-skupine) .sc-isolate .cgrp:not(.open){max-width:var(--tile-min);}

/* ── ARTIKLI (katalog po skupinah) ── */
.art-topbar{display:flex;justify-content:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.art-topbar .btn-narrow{margin-top:0;}
.art-assign{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--green-m);}
.art-assign-str{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.art-assign-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:0 0 auto;}
@media(max-width:560px){
  .art-assign{flex-direction:column;align-items:stretch;gap:10px;}
  .art-assign-str{flex:none;width:100%;}
  .art-assign-acts{width:100%;}
}
.art-thead{display:grid;grid-template-columns:74px 1fr 76px 140px;gap:10px;padding:9px 16px 7px;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mid);font-weight:600;border-bottom:1px solid var(--line);}
.art-thead span:nth-child(3){text-align:right;}
.art-row{display:grid;grid-template-columns:74px 1fr 76px 140px;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);font-size:.9rem;}

.art-r-id{font-family:var(--mono);font-size:.78rem;color:var(--mid);}
.art-r-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.art-r-teza{font-family:var(--mono);font-size:.82rem;color:var(--mid);}
.art-r-cena{font-family:var(--mono);font-size:.82rem;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;}
.art-r-acts{display:inline-flex;gap:4px;justify-content:flex-end;}
.art-r-edit,.art-r-del{border:none;background:none;cursor:pointer;color:var(--mid);width:26px;height:26px;border-radius:7px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;line-height:1;}
.art-r-edit:hover{background:var(--green-m);color:var(--ink);}
.art-r-del:hover{background:rgba(192,57,43,.12);color:#c0392b;}
.art-add-new{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;align-items:center;}
.art-add-new input{padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px;min-width:0;box-sizing:border-box;}
.art-add-new .art-nn-nm{flex:1;min-width:130px;}
.art-add-new .art-nn-id{width:92px;font-family:var(--mono);text-transform:uppercase;}
.art-add-new .art-nn-cena{width:88px;}
.art-add-new input:focus{border-color:var(--green-l);outline:none;}
.art-row-edit{display:block;padding:12px 16px;}
.art-edit-form .ae-nm{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:16px;box-sizing:border-box;}
.art-edit-r{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
.ae-lab{display:flex;flex-direction:column;gap:4px;font-size:.66rem;color:var(--mid);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.ae-lab-nm{width:100%;margin-bottom:8px;}
.art-edit-r input{height:42px;padding:0 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:16px;min-width:0;box-sizing:border-box;}
.art-edit-r .ae-id{width:96px;font-family:var(--mono);text-transform:uppercase;}
.art-edit-r .ae-cena{width:120px;text-align:right;font-variant-numeric:tabular-nums;}
.art-edit-r .ae-save{height:42px;padding:0 18px;border:none;border-radius:100px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.9rem;cursor:pointer;transition:opacity .18s;}
.art-edit-r .ae-save:hover{opacity:.85;}
.art-edit-r .ae-cancel{width:42px;height:42px;flex:0 0 auto;}
.art-edit-form input:focus{border-color:var(--green-l);outline:none;}
.art-chk-list{max-height:min(50vh,360px);overflow:auto;display:flex;flex-direction:column;gap:2px;margin-bottom:16px;}
.assign-chk{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;cursor:pointer;font-size:.92rem;color:var(--ink);text-align:left;}
.assign-chk:hover{background:var(--green-m);}
.assign-chk input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--green-l);position:static;opacity:1;}
@media(max-width:620px){
  .art-thead{display:none;}
  .art-row{grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:1px 10px;padding:10px 16px;}
  .art-r-nm{grid-column:1;grid-row:1;}
  .art-r-id{grid-column:1;grid-row:2;}
  .art-r-cena{grid-column:2;grid-row:1;text-align:right;align-self:center;}
  .art-r-acts{grid-column:2;grid-row:2;justify-self:end;}
}

/* ── UČINKOVITOST (kilaža) ── */
.uc-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px;margin-bottom:14px;}
.uc-top2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.uc-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px 18px;box-sizing:border-box;}
/* 3D krog — delež kg po strankah */
.uc-donut3d-card{margin-bottom:0;display:flex;flex-direction:column;}
.uc-donut-row{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(240px,1fr);gap:14px;margin-bottom:14px;align-items:stretch;}
.uc-donut-row .uc-lest-card{max-height:none;}
.uc-donut-row .uc-lest-eur .uc-lest-list{max-height:min(60vh,440px);}
/* Namizje: obe kartici enako visoki (poravnan spodnji rob) in FIKSNA višina, da se
   ob menjavi Mesec/3m/Vse (drugačno št. strank) stran ne premika gor-dol. */
@media(min-width:821px){
  .uc-donut-row .uc-donut3d-card,.uc-donut-row .uc-lest-card{height:440px;}
  .uc-donut-row .uc-lest-eur .uc-lest-list{max-height:none;flex:1 1 auto;min-height:0;}
}
@media(max-width:820px){.uc-donut-row{grid-template-columns:1fr;}
  /* stalna višina lestvice, da se stran ob menjavi Mesec/3m/Vse ne premika gor-dol */
  .uc-donut-row .uc-lest-eur .uc-lest-list{height:300px;max-height:300px;}}
.uc-page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.uc-range-lbl{font-size:.9rem;font-weight:600;color:var(--mid);margin:0;line-height:1.2;text-transform:capitalize;}
.uc-d3-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.uc-d3-ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
/* Izbirnik obdobja (Statistika): ko je izbran »Mesec«, se poleg pilul pojavi še
   mesečni vnos. Ta je bil višji od pilul (40,8 px proti 37,0 px), zato se je ob
   vsakem preklopu spremenila višina glave in kartice pod njo so poskočile. */
.uc-d3-ctrl{min-height:var(--ctrl-h,37px);}
.uc-d3-month{height:var(--ctrl-h,37px);box-sizing:border-box;padding:0 12px;border:1.5px solid var(--line);border-radius:100px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:.85rem;}
.uc-d3-month:focus{border-color:var(--green-l);outline:none;}
/* Ozki zasloni: oznaka obdobja nad kontrolnike, ti pa čez celo širino. */
@media(max-width:560px){
  .uc-page-head{flex-direction:column;align-items:stretch;gap:10px;}
  .uc-d3-ctrl{width:100%;}
  .uc-d3-ctrl .uc-d3-month{width:100%;}
  .uc-d3-ctrl .pris-tab{white-space:nowrap;}
}
.uc-d3-stage{width:100%;margin-top:6px;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
/* Velikost je določena z razmerjem (viewBox 800×384) — NE z višino kartice.
   Tako se diagram ob osvežitvi (ko se sosednja lestvica naloži) ne poveča. */
.uc3d-svg{display:block;width:100%;height:auto;aspect-ratio:800 / 384;max-height:420px;overflow:visible;}
.uc3d-lab{pointer-events:none;}
.uc3d-p{stroke:rgba(0,0,0,.28);stroke-width:.8px;stroke-linejoin:round;transition:filter .18s ease,stroke .18s ease,stroke-width .18s ease;pointer-events:none;}
/* Hover: obroba + rahlo POTEMNI (light mode) — brez premikanja. */
.uc3d-p.hot{stroke:rgba(0,0,0,.7);stroke-width:1.8px;filter:brightness(.92);}
/* Dark mode: obroba svetla + rahlo POSVETLI. */
:root[data-theme="dark"] .uc3d-p.hot,html[data-theme="dark"] .uc3d-p.hot{stroke:rgba(255,255,255,.72);filter:brightness(1.15);}
.uc3d-hit{cursor:pointer;}
/* Hover: besedilo se NE poveča — samo rahel poudarek (odstotek potemni, ime malenkost odebeli). */
.uc3d-nm,.uc3d-pct{transition:fill .18s ease,font-weight .18s ease;}
.uc3d-lab.hot .uc3d-nm{fill:var(--ink);font-weight:700;}
.uc3d-lab.hot .uc3d-pct{fill:var(--ink);}
.uc3d-lead{stroke:var(--mid);stroke-width:1;opacity:.55;fill:none;transition:opacity .18s ease;}
.uc3d-lab.hot .uc3d-lead{opacity:.85;}
.uc3d-nm{fill:var(--ink);font-family:var(--sans);font-size:18px;font-weight:600;}
.uc3d-pct{fill:var(--mid);font-family:var(--mono);font-size:15px;}
/* Elegantna pojavitev napisov od leve proti desni (zamik --d nastavi JS po x-poziciji). */
@keyframes uc3d-lab-fade{from{opacity:0;}to{opacity:1;}}
@keyframes uc3d-txt-slide{from{opacity:0;transform:translateX(-16px);}to{opacity:1;transform:translateX(0);}}
.uc3d-lab.sweep{animation:uc3d-lab-fade .45s ease both;animation-delay:var(--d,0ms);}
.uc3d-lab.sweep .uc3d-lab-txt{animation:uc3d-txt-slide .55s cubic-bezier(.22,.61,.36,1) both;animation-delay:var(--d,0ms);}
@media(prefers-reduced-motion:reduce){.uc3d-lab.sweep,.uc3d-lab.sweep .uc3d-lab-txt{animation:none;}}
/* Ob menjavi obdobja: napisi se po koncu preoblikovanja rezin hitro in čisto pojavijo (brez glitcha). */
.uc3d-labfade{animation:uc3d-lab-fade .22s ease both;}
@media(prefers-reduced-motion:reduce){.uc3d-labfade{animation:none;}}
@media(max-width:560px){.uc3d-nm{font-size:22px;}.uc3d-pct{font-size:19px;}}
.uc-card .sec-h{margin:0 0 6px;}
.uc-donut-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.uc-donut{flex:0 0 auto;}
.uc-leg-list{flex:1;min-width:130px;display:flex;flex-direction:column;gap:5px;}
.uc-leg{display:flex;align-items:center;gap:7px;font-size:.78rem;}
.uc-dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
.uc-leg-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.uc-leg-v{font-family:var(--mono);color:var(--mid);flex:0 0 auto;font-variant-numeric:tabular-nums;}
.uc-stat{display:flex;flex-direction:column;justify-content:center;}
.uc-big{font-size:2.3rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0 6px;}
.uc-big span{font-size:.98rem;font-weight:500;color:var(--mid);}
/* ── lestvica kg/uro po dnevih ── */
.uc-lest-card{display:flex;flex-direction:column;min-height:0;}
.uc-lest-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.uc-lest-h .sec-h{margin:0;}
.uc-lest-toggle{cursor:pointer;white-space:nowrap;}
.uc-lest-list{display:flex;flex-direction:column;max-height:320px;overflow-y:auto;}
.uc-lest-row{display:grid;grid-template-columns:24px 1fr auto;grid-template-areas:"rank dan v" "rank sub v";column-gap:9px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);}
.uc-lest-row:last-child{border-bottom:none;}
.uc-lest-rank{grid-area:rank;color:var(--mid);font-variant-numeric:tabular-nums;font-size:.85rem;}
.uc-lest-dan{grid-area:dan;font-weight:600;color:var(--ink);}
.uc-lest-sub{grid-area:sub;color:var(--mid);font-size:.8rem;}
.uc-lest-v{grid-area:v;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;font-size:1.05rem;font-weight:600;}
.uc-lest-v span{font-size:.76rem;font-weight:500;color:var(--mid);}
.uc-lest-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding:11px 2px 2px;border-top:1px solid var(--line);}
.uc-lest-foot:empty{display:none;}
.uc-lest-foot-k{color:var(--mid);font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;}
.uc-lest-foot-v{font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:700;color:var(--ink);}

/* ── PRISOTNOST ── */
.pris-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px 18px;margin-bottom:14px;}
.pris-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
.pris-h .sec-h{margin:0;}
.pris-count{font-family:var(--mono);font-size:.9rem;color:var(--mid);}
.pris-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
.pris-row:last-child{border-bottom:none;}
.pris-nm{flex:1;font-size:.95rem;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pris-badge{font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:100px;white-space:nowrap;flex:0 0 auto;}
.pris-badge.in{background:rgba(47,143,111,.16);color:var(--wm-green,#3f9f6f);}
.pris-badge.out{background:var(--green-m);color:var(--mid);}
.pris-hbtns{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
@media(max-width:560px){.pris-h{flex-direction:column;align-items:stretch;gap:10px;}.pris-hbtns{justify-content:flex-start;}}
.pris-tabs{display:inline-flex;gap:4px;background:var(--green-m);border-radius:100px;padding:3px;}
.pris-tab{border:none;background:none;color:var(--mid);font-size:.82rem;font-weight:600;padding:5px 14px;border-radius:100px;cursor:pointer;}
.pris-tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.pris-barvrsta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 14px;}
.pris-datum{display:flex;align-items:center;gap:8px;margin:0;}
.pris-datum input{height:40px;box-sizing:border-box;padding:0 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px;line-height:normal;}
.pris-datum input:focus{border-color:var(--green-l);outline:none;}
.pris-nav{width:40px;height:40px;flex:0 0 auto;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.pris-nav svg{width:18px;height:18px;display:block;}
.pris-nav:hover{border-color:var(--green-l);background:var(--green-m);}
/* »Danes« — ponastavi datum na privzeto (današnji dan / tekoči mesec). */
.dat-danes{flex:0 0 auto;height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;}
.dat-danes:hover{border-color:var(--green-l);background:var(--green-m);}
/* Mobilno: datum-navigator v ENI vrstici (‹ datum ›), zavihki polna širina spodaj. */
@media(max-width:560px){
  .pris-barvrsta{flex-direction:column;align-items:stretch;gap:10px;}
  .pris-datum{flex-wrap:nowrap;width:100%;gap:8px;}
  .pris-datum input{flex:1 1 auto;min-width:0;}
  .pris-tabs{display:flex;width:100%;}
  .pris-tabs .pris-tab{flex:1;text-align:center;padding:7px 8px;}
}
.pris-tbl{width:100%;border-collapse:collapse;}
.pris-tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mid);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);}
.pris-tbl td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:.9rem;color:var(--ink);vertical-align:middle;}
.pris-tbl tbody tr:last-child td{border-bottom:none;}
.pris-tbl tfoot td{font-weight:700;color:var(--ink);border-top:2px solid var(--line);border-bottom:none;padding-top:12px;}
/* Prisotnost: pri ožjem oknu naj se tabela NE stiska (prekrivanje stolpcev) — raje vodoravni scroll. */
#sec-prisotnost .pris-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
#sec-prisotnost .pris-tbl-dan,#sec-prisotnost .pris-tbl-oseba{min-width:600px;}
.pris-pairs{font-family:var(--mono);font-size:.82rem;color:var(--mid);}
.pris-chip{display:inline-flex;align-items:center;vertical-align:middle;gap:1px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px 4px 2px 3px;margin:3px 5px 3px 0;white-space:nowrap;transition:border-color .15s;}
.pris-chip:hover{border-color:var(--green-l);}
.pris-chip-t{border:none;background:none;color:var(--mid);font-family:var(--mono);font-size:.78rem;cursor:pointer;padding:3px 9px;border-radius:999px;transition:color .15s;}
.pris-chip-t:hover{color:var(--ink);}
.pris-chip-x{border:none;background:none;color:var(--mid);cursor:pointer;font-size:14px;line-height:1;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;transition:background .15s,color .15s;}
.pris-chip-x:hover{background:rgba(192,57,43,.12);color:#c0392b;}
html[data-theme="dark"] .pris-chip-x:hover{background:rgba(255,138,122,.16);color:#ff8a7a;}
.pris-ure{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
#sec-statistika .pris-tbl th:nth-child(2),#sec-statistika .pris-tbl th:nth-child(3),#sec-statistika .pris-tbl td:nth-child(2),#sec-statistika .pris-tbl td:nth-child(3){text-align:right;}
.uc-eur{color:var(--mid);}
/* Evidenca kg — razvrščanje s klikom na naslov stolpca. Puščica je ista ikona
   kot pri spustnih menijih; obrne se pri naraščajočem vrstnem redu. */
.uc-ev-tbl th{padding:0;}
.uc-th{display:inline-flex;align-items:center;gap:5px;width:100%;padding:6px 8px;border:none;background:none;
  font:inherit;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mid);font-weight:600;
  cursor:pointer;border-radius:7px;}
.uc-th:hover{color:var(--ink);background:var(--green-m);}
.uc-th.on{color:var(--ink);}
.uc-th-p{flex:0 0 auto;opacity:0;transition:opacity .15s ease,transform .18s ease;}
.uc-th:hover .uc-th-p{opacity:.35;}
.uc-th.on .uc-th-p{opacity:1;}
.uc-th.on.gor .uc-th-p{transform:rotate(180deg);}
#sec-statistika .uc-ev-tbl th:nth-child(2) .uc-th,
#sec-statistika .uc-ev-tbl th:nth-child(3) .uc-th{justify-content:flex-end;}
.uc-obd-lbl{margin:2px 0 0;font-size:.74rem;color:var(--mid);}
.pris-act{text-align:right;white-space:nowrap;}
.pris-emp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
.pris-emp:last-of-type{border-bottom:none;}
.pris-emp-act{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
/* Oznaka povezanega uporabnika portala ob imenu zaposlenega. */
.pris-upo-tag{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:100px;background:var(--green-m);color:var(--ink);font-size:.72rem;font-weight:600;vertical-align:middle;font-variant-numeric:tabular-nums;}
.pris-emp-act .cgrp-btn.on{border-color:var(--green-l);background:var(--green-m);color:var(--ink);}
.pris-add{display:flex;gap:8px;align-items:stretch;margin-top:14px;}
