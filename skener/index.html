<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0d1f17"/>
<title>Skener računov — SmartClean</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://anrhtgbckxrccnafcmsz.supabase.co wss://anrhtgbckxrccnafcmsz.supabase.co; base-uri 'none'; object-src 'none'"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#eef2f0;color:#0d1f17;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    touch-action:manipulation;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  .top{background:#0d1f17;color:#fff;padding:16px 18px;
    padding-top:calc(16px + env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wm{font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:-.03em;
    line-height:.9;font-size:22px;color:#fff}
  .wm span{color:#5fd39a}
  .top .lbl{font-size:12px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .back{color:#cfe9dc;text-decoration:none;font-size:13px;font-weight:600;
    border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .body{flex:1;padding:18px;display:flex;flex-direction:column;gap:16px}
  h1{font-size:19px;margin:2px 0 0}
  .sub{font-size:13px;color:#5a6d63;margin:0}
  .card{background:#fff;border:1px solid #dfe6e2;border-radius:16px;padding:16px;
    box-shadow:0 1px 3px rgba(13,31,23,.05)}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#31463c}
  input[type=text],input[type=date],textarea{width:100%;border:1px solid #cfd8d3;border-radius:12px;
    padding:12px 13px;font-size:16px;font-family:inherit;background:#fff;color:#0d1f17}
  textarea{min-height:70px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:#1a6644;box-shadow:0 0 0 3px rgba(26,102,68,.12)}
  .shoot{display:block;width:100%;border:2px dashed #b7c6be;border-radius:16px;background:#f5f8f6;
    color:#1a6644;font-weight:700;font-size:16px;padding:26px 14px;text-align:center;cursor:pointer}
  .shoot svg{display:block;margin:0 auto 8px;width:38px;height:38px;stroke:#1a6644}
  .shoot small{display:block;font-weight:500;color:#7d8f86;margin-top:4px;font-size:12px}
  #fileIn{display:none}
  .prev{position:relative;border-radius:16px;overflow:hidden;border:1px solid #dfe6e2;background:#000;display:none}
  .prev img{display:block;width:100%;max-height:46dvh;object-fit:contain}
  .prev .re{position:absolute;top:10px;right:10px;background:rgba(13,31,23,.82);color:#fff;
    border:none;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;
    font-weight:700;color:#fff;background:#1a6644;cursor:pointer}
  .btn:disabled{opacity:.5}
  .btn.sec{background:#fff;color:#1a6644;border:1px solid #1a6644}
  .msg{border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;display:none}
  .msg.show{display:block}
  .msg.ok{background:#e6f5ec;color:#146c3f}
  .msg.bad{background:#fdecec;color:#b02525}
  .foot{padding:14px 18px calc(14px + env(safe-area-inset-bottom));text-align:center;
    font-size:12px;color:#8a998f}
  .gate{padding:40px 24px;text-align:center}
  .gate a{color:#1a6644;font-weight:700}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="wm">Smart<span>Clean</span></div>
    <a class="back" href="../">‹ Portal</a>
  </div>

  <div id="gate" class="body gate hide"></div>

  <div id="app" class="body hide">
    <div>
      <h1>Skeniraj račun</h1>
      <p class="sub">Fotografiraj račun, dodaj opombo in shrani v Dokumente.</p>
    </div>

    <div id="msg" class="msg"></div>

    <div class="card">
      <input type="file" id="fileIn" accept="image/*" capture="environment"/>
      <label class="shoot" id="shootBtn" for="fileIn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Fotografiraj račun
        <small>ali izberi sliko iz galerije</small>
      </label>
      <div class="prev" id="prev">
        <button type="button" class="re" id="reBtn">Zamenjaj</button>
        <img id="prevImg" alt="Predogled"/>
      </div>
    </div>

    <div class="card">
      <label for="datum">Datum računa</label>
      <input type="date" id="datum"/>
      <div style="height:14px"></div>
      <label for="opomba">Opomba</label>
      <textarea id="opomba" placeholder="npr. Petrol — gorivo, ali dobavitelj / znesek …"></textarea>
    </div>

    <button type="button" class="btn" id="saveBtn" disabled>Shrani dokument</button>
  </div>

  <div class="foot">SmartClean · Dokumenti se shranijo v portal</div>
</div>

<script src="../config.js"></script>
<script src="../supabase.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var cfg = window.SC_CONFIG || {};
  var URL_ = cfg.url || null, KEY = cfg.key || null;
  try {
    URL_ = localStorage.getItem('sc-portal-url') || URL_;
    KEY  = localStorage.getItem('sc-portal-key') || KEY;
  } catch(e){}
  if (URL_) URL_ = URL_.replace(/\/$/, '');

  var createClient = (window.supabase && window.supabase.createClient) || null;
  var sb = (createClient && URL_ && KEY) ? createClient(URL_, KEY) : null;

  var slika = null;   // { blob, mime, ext }

  function pokazi(el){ el.classList.remove('hide'); }
  function skrij(el){ el.classList.add('hide'); }
  function sporocilo(t, ok){
    var m = $('msg'); m.textContent = t;
    m.className = 'msg show ' + (ok ? 'ok' : 'bad');
    if (ok) setTimeout(function(){ m.className = 'msg'; }, 4000);
  }
  function gate(html){
    var g = $('gate'); g.innerHTML = html; skrij($('app')); pokazi(g);
  }

  // ─── preverjanje seje ───────────────────────────────────────────────
  async function start(){
    if (!sb) {
      gate('<h1>Napaka</h1><p class="sub">Portal ni pravilno nastavljen. Odpri najprej <a href="../">portal</a>.</p>');
      return;
    }
    var u = null;
    try { var r = await sb.auth.getUser(); u = r && r.data ? r.data.user : null; } catch(e){}
    if (!u) {
      gate('<h1>Prijava potrebna</h1><p class="sub">Najprej se prijavi v <a href="../">portal</a>, nato se vrni na to stran.</p>');
      return;
    }
    // je oseba osebje?
    try {
      var p = await sb.from('profiles').select('is_staff').eq('id', u.id).maybeSingle();
      if (!(p && p.data && p.data.is_staff)) {
        gate('<h1>Ni dovoljenja</h1><p class="sub">Ta stran je namenjena osebju. Prijavljen si kot stranka.</p>');
        return;
      }
    } catch(e){}
    skrij($('gate')); pokazi($('app'));
    // datum = danes
    try {
      var d = new Date();
      var mm = String(d.getMonth()+1).padStart(2,'0');
      var dd = String(d.getDate()).padStart(2,'0');
      $('datum').value = d.getFullYear()+'-'+mm+'-'+dd;
    } catch(e){}
  }

  // ─── izbira / fotografija ───────────────────────────────────────────
  $('fileIn').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    stisniSliko(f).then(function(res){
      slika = res;
      var url = URL.createObjectURL(res.blob);
      $('prevImg').src = url;
      $('prev').style.display = 'block';
      $('shootBtn').style.display = 'none';
      $('saveBtn').disabled = false;
    }).catch(function(){
      sporocilo('Slike ni bilo mogoče obdelati. Poskusi znova.', false);
    });
    e.target.value = '';
  });

  $('reBtn').addEventListener('click', function(){
    slika = null;
    $('prev').style.display = 'none';
    $('prevImg').src = '';
    $('shootBtn').style.display = 'block';
    $('saveBtn').disabled = true;
    $('fileIn').click();
  });

  // pomanjšaj + JPEG, da so datoteke majhne (računi so čitljivi tudi tako)
  function stisniSliko(file){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var fr = new FileReader();
      fr.onload = function(){ img.src = fr.result; };
      fr.onerror = reject;
      img.onload = function(){
        try {
          var maxD = 1800;
          var w = img.naturalWidth, h = img.naturalHeight;
          var sc = Math.min(1, maxD / Math.max(w, h));
          var cw = Math.round(w*sc), ch = Math.round(h*sc);
          var cv = document.createElement('canvas');
          cv.width = cw; cv.height = ch;
          cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
          cv.toBlob(function(b){
            if (!b) { reject(); return; }
            resolve({ blob: b, mime: 'image/jpeg', ext: 'jpg' });
          }, 'image/jpeg', 0.82);
        } catch(err){ reject(err); }
      };
      img.onerror = reject;
      fr.readAsDataURL(file);
    });
  }

  function uid(){
    try { return (crypto.randomUUID && crypto.randomUUID()) || (''+Date.now()+'-'+Math.random().toString(16).slice(2)); }
    catch(e){ return ''+Date.now()+'-'+Math.floor(Math.random()*1e9); }
  }

  // ─── shranjevanje ───────────────────────────────────────────────────
  $('saveBtn').addEventListener('click', async function(){
    if (!slika) { sporocilo('Najprej fotografiraj račun.', false); return; }
    var btn = $('saveBtn');
    btn.disabled = true; btn.textContent = 'Shranjujem …';
    try {
      var datum = $('datum').value || null;
      var opomba = $('opomba').value.trim();
      var d = datum ? datum.replace(/-/g,'/') : (new Date().toISOString().slice(0,10).replace(/-/g,'/'));
      var path = d + '/' + uid() + '.' + slika.ext;

      var up = await sb.storage.from('dokumenti').upload(path, slika.blob, {
        contentType: slika.mime, upsert: false
      });
      if (up.error) throw up.error;

      var ins = await sb.from('documents').insert({
        opomba: opomba || null,
        datum: datum,
        storage_path: path,
        mime: slika.mime,
        velikost: slika.blob.size
      });
      if (ins.error) {
        // če vpis pade, poberi za sabo naloženo sliko
        try { await sb.storage.from('dokumenti').remove([path]); } catch(e){}
        throw ins.error;
      }

      // ponastavi za naslednji račun
      slika = null;
      $('prev').style.display = 'none';
      $('prevImg').src = '';
      $('shootBtn').style.display = 'block';
      $('opomba').value = '';
      sporocilo('Shranjeno ✓  Dokument je v portalu (Dokumenti).', true);
      window.scrollTo(0,0);
    } catch(err){
      sporocilo('Napaka pri shranjevanju: ' + (err && err.message ? err.message : err), false);
    } finally {
      btn.textContent = 'Shrani dokument';
      btn.disabled = false;
    }
  });

  start();
})();
</script>
</body>
</html>
